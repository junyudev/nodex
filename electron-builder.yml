appId: app.jyu.nodex
productName: Nodex
afterPack: scripts/restore-packaged-runtime-closure.mjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
  - "!**/webpack-stats.json"
  - "!**/__snapshots__/**"
  - "!**/__tests__/**"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!node_modules/@types/**"
  - "!node_modules/node-pty/deps/**"
  - "!node_modules/node-pty/scripts/**"
  - "!node_modules/node-pty/src/**"
  - "!node_modules/node-pty/third_party/**"
  - "!node_modules/node-pty/typings/**"
  - "!node_modules/node-pty/prebuilds/win32-*/**"
asarUnpack:
  - "**/*.node"
npmRebuild: true
extraResources:
  - from: .generated/prepared-electron-build.json
    to: prepared-electron-build.json
  - from: .generated/official-agent-skills
    to: agent-skills
    filter:
      - "**/*"
  - from: resources/icon.png
    to: icon.png
  - from: resources/nodex-notification.aiff
    to: nodex-notification.aiff
  - from: .generated/build-resources/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: .generated/codex-runtime/bin
    to: bin
    filter:
      - nodex
      - nodex-appshot-helper
      - nodex-dictation-helper
      - nodex-browser-profile-helper
      - nodex-core
      - rust-core-runtime.json
  - from: .generated/codex-runtime/agent-runtime
    to: .
    filter:
      - "**/*"
  - from: .generated/sparkle-runtime/${arch}/nodex-sparkle.node
    to: native/nodex-sparkle.node
  - from: .generated/sparkle-runtime/${arch}/sparkle-runtime.json
    to: native/sparkle-runtime.json
  - from: .generated/clipboard-runtime/${arch}/nodex-clipboard.node
    to: native/nodex-clipboard.node
extraFiles:
  - from: resources/macos/app.jyu.nodex.background-service.core.plist
    to: Helpers/Nodex Service.app/Contents/Library/LaunchAgents/app.jyu.nodex.background-service.core.plist
  - from: resources/macos/nodex-service-Info.plist
    to: Helpers/Nodex Service.app/Contents/Info.plist
  - from: .generated/codex-runtime/bin/nodex-service
    to: Helpers/Nodex Service.app/Contents/MacOS/nodex-service
  - from: .generated/sparkle-runtime/${arch}/Sparkle.framework
    to: Frameworks/Sparkle.framework
    filter:
      - "**/*"
extraMetadata:
  main: out/main/bootstrap.js
protocols:
  - name: Nodex Deep Link
    schemes:
      - nodex

# --- macOS ---
mac:
  icon: icon.icon
  sign: scripts/sign-macos-runtime.mjs
  minimumSystemVersion: 15.0.0
  target:
    - dmg
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: public.app-category.productivity
  hardenedRuntime: true
  binaries:
    - Contents/Resources/native/nodex-clipboard.node
    - Contents/Resources/bin/nodex
    - Contents/Resources/bin/nodex-appshot-helper
    - Contents/Resources/bin/nodex-dictation-helper
    - Contents/Resources/bin/nodex-browser-profile-helper
    - Contents/Resources/bin/nodex-core
    - Contents/Resources/browser-runtime/bin/codex
    - Contents/Resources/browser-runtime/bin/node
    - Contents/Resources/browser-runtime/bin/node_repl
    - Contents/Helpers/Nodex Service.app/Contents/MacOS/nodex-service
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  extendInfo:
    NSMicrophoneUsageDescription: Nodex uses your microphone for dictation.
    SUPublicEDKey: YNySLZ74gjVAOpEdMo9OOEPvuTEMZf8fMnI+oQD7Ifs=
    SURequireSignedFeed: true
    SUVerifyUpdateBeforeExtraction: true
    SUAllowsAutomaticUpdates: true
    SUEnableAutomaticChecks: false
    SUAutomaticallyUpdate: true
  notarize: true

dmg:
  sign: true
  writeUpdateInfo: false
  title: "${productName}"
  background: dmg-background.png
  iconSize: 128
  iconTextSize: 16
  contents:
    - x: 176
      y: 135
      type: file
    - x: 464
      y: 135
      type: link
      path: /Applications

