[package]
name = "nodex-core-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nodex-core"
path = "src/main.rs"

[dependencies]
nodex-platform.workspace = true
nodex-core = { path = "../nodex-core" }
nodex-core-contracts.workspace = true
nodex-core-protocol.workspace = true
async-stream.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
fs2.workspace = true
futures-core.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
http-body-util.workspace = true
hyper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.14"
hyper-util = { workspace = true, features = ["service", "tokio", "server", "http1"] }
tokio-io-timeout = "1"
socket2 = "0.6"

[dev-dependencies]
# Read-only storage inspection verifies that enrollment never persists bearer secrets.
rusqlite.workspace = true
nodex-platform = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true
