[package]
name = "nodex-search-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:hashbrown", "dep:nucleo-matcher", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[dependencies]
nodex-core-contracts = { path = "../nodex-core-contracts" }
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
serde-wasm-bindgen = { version = "0.6.5", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
icu_properties = "2.2.0"
rust-stemmers = "1.2.0"

hashbrown = { version = "0.17.1", default-features = false, optional = true }
nucleo-matcher = { git = "https://github.com/helix-editor/nucleo.git", rev = "4253de9faabb4e5c6d81d946a5e35a90f87347ee", optional = true }

[dev-dependencies]
hashbrown = { version = "0.17.1", default-features = false }
nucleo-matcher = { git = "https://github.com/helix-editor/nucleo.git", rev = "4253de9faabb4e5c6d81d946a5e35a90f87347ee" }

[lints]
workspace = true
