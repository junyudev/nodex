packages:
  - "packages/*"
  - "packages/agent-runtime/vendor/*"
  - "third_party/blocknote/packages/*"

patchedDependencies:
  "@opencode/client@2.0.23": patches/@opencode__client@2.0.23.patch
  "@opencode/protocol@2.0.23": patches/@opencode__protocol@2.0.23.patch
  "@opencode/schema@2.0.23": patches/@opencode__schema@2.0.23.patch
  "@y/prosemirror@2.0.0-6": patches/@y__prosemirror@2.0.0-6.patch
  "@effect/platform-node-shared@4.0.3": patches/@effect__platform-node-shared@4.0.3.patch
  "@effect/vitest@4.0.3": patches/@effect__vitest@4.0.3.patch
  y-prosemirror@1.3.7: patches/y-prosemirror@1.3.7.patch
  yjs@13.6.32: patches/yjs@13.6.32.patch

supportedArchitectures:
  os:
    - current
  cpu:
    - current

overrides:
  "@opencode/protocol>effect": 4.0.3
  "@opencode/schema>effect": 4.0.3
  remark-breaks: 4.0.0
  "@types/node": 24.13.3
  "@babel/core": 7.29.7
  "@xmldom/xmldom": 0.8.15
  dompurify: 3.4.16
  flatted: 3.4.2
  form-data: 4.0.6
  immutable: 4.3.9
  lodash: 4.18.1
  lodash-es: 4.18.1
  mermaid: 11.16.1
  nanoid: 3.3.18
  node-abi: ^4.31.0
  picomatch: 4.0.4
  postcss: 8.5.23
  prosemirror-model: 1.25.11
  prosemirror-transform: 1.12.0
  prosemirror-view: 1.42.3
  "@tiptap/extension-bubble-menu": 3.31.4
  "@tiptap/extension-floating-menu": 3.31.4
  rollup: 4.62.0
  sass: 1.101.0
  tar: 7.5.21
  tinypool: 2.1.2
  tmp: 0.2.7
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.4
  yaml: 2.9.0
  "@modelcontextprotocol/sdk": 1.32.1
  js-yaml: 4.3.2
  katex: 0.18.2
  # Vite+ uses one Vitest 5 runtime; older library utilities retain patched major-4 APIs.
  "@vitest/expect@^5.0.0": 5.0.4
  "@vitest/expect@^4.0.0": 4.1.11
  "@vitest/runner@^4.0.0": 4.1.11
  "@vitest/spy@^5.0.0": 5.0.4
  "@vitest/spy@^4.0.0": 4.1.11
  "@vitest/utils@^5.0.0": 5.0.4
  "@vitest/utils@^4.0.0": 4.1.11
  "@vitest/mocker@^5.0.0": 5.0.4
  "@vitest/mocker@^4.0.0": 4.1.11
  "@vitest/browser@^5.0.0": 5.0.4
  "@vitest/browser@^4.0.0": 4.1.11
  "@vitest/snapshot@^5.0.0": 5.0.4
  "@vitest/snapshot@^4.0.0": 4.1.11
  "@vitest/pretty-format@^5.0.0": 5.0.4
  "@vitest/pretty-format@^4.0.0": 4.1.11
  "@vitest/browser-preview@^5.0.0": 5.0.4
  "@vitest/browser-preview@^4.0.0": 4.1.11

audit:
  # Packaging-only logger uses fixed format strings; see docs/SECURITY.md.
  ignore:
    - GHSA-hp3w-g68c-fv3c

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  # The repository prepares a verified, independent dist from the shared extraction cache.
  electron: false
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: false
  node-pty: true
  sharp: false
  unrs-resolver: false
  tsc-rs: true

packageExtensions:
  "@effect/vitest@4.0.3":
    peerDependencies:
      vite-plus: 1.1.0

peerDependencyRules:
  # Vite+ metadata predates the coordinated browser test runner.
  allowedVersions:
    "vite-plus>@vitest/browser-playwright": 5.0.4
  allowAny:
    # Vite+ supplies the Vite API through its own package version.
    - vite

minimumReleaseAgeExclude:
  - "@oxc-parser/binding-android-arm-eabi@0.146.0"
  - "@oxc-parser/binding-android-arm64@0.146.0"
