packages:
  - "packages/*"
  - "packages/agent-runtime/vendor/*"
  - "third_party/blocknote/packages/*"

patchedDependencies:
  "@pierre/diffs@1.6.1": patches/@pierre__diffs@1.6.1.patch
  "@y/prosemirror@2.0.0-6": patches/@y__prosemirror@2.0.0-6.patch
  "@effect/vitest@4.0.6": patches/@effect__vitest@4.0.6.patch
  y-prosemirror@1.3.7: patches/y-prosemirror@1.3.7.patch
  yjs@13.6.33: patches/yjs@13.6.33.patch
  "@base-ui/react@1.9.0": patches/@base-ui__react@1.9.0.patch
  "@vitest/browser@5.0.5": patches/@vitest__browser@5.0.5.patch
  "vitest@5.0.5": patches/vitest@5.0.5.patch
  prosemirror-view@1.42.8: patches/prosemirror-view@1.42.8.patch
  "@voidzero-dev/vite-plus-core@1.4.0": patches/@voidzero-dev__vite-plus-core@1.4.0.patch
  "@electron/asar@3.4.1": patches/@electron__asar@3.4.1.patch
  dir-compare@4.2.0: patches/dir-compare@4.2.0.patch
  "@redocly/openapi-core@1.34.17": patches/@redocly__openapi-core@1.34.17.patch
  glob@7.2.3: patches/glob@7.2.3.patch
  app-builder-lib@26.18.0: patches/app-builder-lib@26.18.0.patch

supportedArchitectures:
  os:
    - current
  cpu:
    - current

overrides:
  # Electron and React must share one Sentry SDK version for renderer initialization.
  "@sentry/electron>@sentry/browser": 11.9.0
  "@sentry/electron>@sentry/core": 11.9.0
  "@sentry/electron>@sentry/node": 11.9.0
  "@sentry/electron>@sentry/server-utils": 11.9.0
  "@opencode/protocol>effect": 4.0.6
  "@opencode/schema>effect": 4.0.6
  # Trees uses the shared color API; theming 1.0.2 also supports Diffs' Theme 2.
  "@pierre/trees@1.0.0-beta.6>@pierre/theming": 1.0.2
  # Excalidraw's tab API is unchanged; replace its React 18-era Radix closure.
  "@excalidraw/excalidraw@0.18.1>@radix-ui/react-tabs": 1.2.1
  remark-breaks: 4.0.0
  "@types/node": 24.19.2
  "@babel/core": 7.29.13
  # Expo 58.0.20 supports React Native 0.88.0. Later Core builds use 0.88.1 symbols.
  "expo@58.0.20>expo-modules-core": 58.0.27
  # plist omits the MIME type required by xmldom 0.9; keep its patched 0.8 API.
  "plist>@xmldom/xmldom": 0.8.15
  dompurify: 3.4.17
  flatted: 3.4.2
  form-data: 4.0.6
  # Keep modern walkers on the release that stops traversal after cancellation.
  "glob@>=9": 14.0.3
  immutable: 4.3.9
  lodash: 4.18.1
  lodash-es: 4.18.1
  mermaid: 12.3.0
  # Legacy tooling callsites are patched to the named matcher and Matcher APIs.
  minimatch: 11.0.3
  nanoid: 3.3.18
  node-abi: 4.40.0
  picomatch: 4.0.4
  postcss: 8.5.23
  prosemirror-model: 1.25.13
  prosemirror-transform: 1.12.5
  prosemirror-view: 1.42.8
  "@tiptap/extension-bubble-menu": 3.33.1
  "@tiptap/extension-floating-menu": 3.33.1
  rollup: 4.62.0
  sass: 1.101.0
  tar: 7.5.21
  tinypool: 2.1.2
  tmp: 0.2.7
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  yaml: 2.9.1
  "@modelcontextprotocol/sdk": 1.32.2
  "@modelcontextprotocol/sdk>hono": 4.13.14
  "@modelcontextprotocol/sdk>@hono/node-server": 2.1.5
  # Legacy tool APIs (including Redocly Schema.extend) still require YAML 4.
  "js-yaml@<5": 4.3.2
  # Keep transitive math renderers on the security-patched release.
  katex: 0.19.1
  # Vite+ uses one Vitest 5 runtime; older library utilities retain patched major-4 APIs.
  "@vitest/expect@^5.0.0": 5.0.5
  "@vitest/expect@^4.0.0": 4.1.11
  "@vitest/runner@^4.0.0": 4.1.11
  "@vitest/spy@^5.0.0": 5.0.5
  "@vitest/spy@^4.0.0": 4.1.11
  "@vitest/utils@^5.0.0": 5.0.5
  "@vitest/utils@^4.0.0": 4.1.11
  "@vitest/mocker@^5.0.0": 5.0.5
  "@vitest/mocker@^4.0.0": 4.1.11
  "@vitest/browser@^5.0.0": 5.0.5
  "@vitest/browser@^4.0.0": 4.1.11
  "@vitest/snapshot@^5.0.0": 5.0.5
  "@vitest/snapshot@^4.0.0": 4.1.11
  "@vitest/pretty-format@^5.0.0": 5.0.5
  "@vitest/pretty-format@^4.0.0": 4.1.11
  "@vitest/browser-preview@^5.0.0": 5.0.5
  "@vitest/browser-preview@^4.0.0": 4.1.11

audit:
  # Packaging-only logger uses fixed format strings; see docs/SECURITY.md.
  ignore:
    - GHSA-hp3w-g68c-fv3c

allowBuilds:
  "@parcel/watcher": true
  # Its install script fetches the pinned native grammars and math renderer Nodex Mobile ships.
  "react-native-enriched-markdown@file:packages/mobile/deps/react-native-enriched-markdown-1.2.0.tgz": true
  "@sentry/cli": true
  # The repository prepares a verified, independent dist from the shared extraction cache.
  electron: false
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: false
  node-pty: true
  sharp: false
  unrs-resolver: false
  tsc-rs: true

packageExtensions:
  "@effect/vitest@4.0.6":
    peerDependencies:
      vite-plus: 1.4.0

peerDependencyRules:
  allowedVersions:
    # OpenCode shares the workspace Effect patch with its protocol/schema packages.
    "@opencode/client@2.1.4>effect": 4.0.6
  allowAny:
    # Vite+ supplies the Vite API through its own package version.
    - vite

minimumReleaseAgeExclude:
  - vitest@5.0.5
  - "@vitest/browser-playwright@5.0.5"
  - "@vitest/browser-preview@5.0.5"
  - "@vitest/browser@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/pretty-format@5.0.5"
  - "@vitest/snapshot@5.0.5"
  - "@vitest/spy@5.0.5"
  - "@vitest/ui@5.0.5"
  - "@vitest/utils@5.0.5"
  # Recently published tooling in the Expo SDK 58 lockfile.
  - "@expo/cli@58.1.19"
  - "@expo/config-plugins@58.0.12"
  - "@expo/config@58.0.11"
  - "@expo/env@2.5.4"
  - "@expo/fingerprint@0.21.9"
  - "@expo/inline-modules@0.2.9"
  - "@expo/local-build-cache-provider@58.0.11"
  - "@expo/log-box@58.0.15"
  - "@expo/metro-config@58.0.21"
  - "@expo/prebuild-config@58.0.19"
  - "@expo/router-server@58.0.21"
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-modules-autolinking@58.0.17
  - expo-modules-jsi@58.0.22
  # Recently published Claude Agent SDK and matching native runtimes for the verified upgrade.
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.322"
  - "@anthropic-ai/claude-agent-sdk@0.3.322"
