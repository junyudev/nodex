packages:
  - "packages/*"
  - "packages/agent-runtime/vendor/*"
  - "third_party/blocknote/packages/*"

patchedDependencies:
  "@pierre/diffs@1.6.1": patches/@pierre__diffs@1.6.1.patch
  "@opencode/client@2.0.23": patches/@opencode__client@2.0.23.patch
  "@opencode/protocol@2.0.23": patches/@opencode__protocol@2.0.23.patch
  "@opencode/schema@2.0.23": patches/@opencode__schema@2.0.23.patch
  "@y/prosemirror@2.0.0-6": patches/@y__prosemirror@2.0.0-6.patch
  "@effect/platform-node-shared@4.0.3": patches/@effect__platform-node-shared@4.0.3.patch
  "@effect/vitest@4.0.3": patches/@effect__vitest@4.0.3.patch
  y-prosemirror@1.3.7: patches/y-prosemirror@1.3.7.patch
  yjs@13.6.33: patches/yjs@13.6.33.patch

supportedArchitectures:
  os:
    - current
  cpu:
    - current

overrides:
  "@opencode/protocol>effect": 4.0.3
  "@opencode/schema>effect": 4.0.3
  # Trees uses the shared color API; theming 1.0.2 also supports Diffs' Theme 2.
  "@pierre/trees@1.0.0-beta.6>@pierre/theming": 1.0.2
  # Excalidraw's tab API is unchanged; replace its React 18-era Radix closure.
  "@excalidraw/excalidraw@0.18.1>@radix-ui/react-tabs": 1.2.1
  remark-breaks: 4.0.0
  "@types/node": 24.13.3
  "@babel/core": 7.29.7
  "@xmldom/xmldom": 0.8.15
  dompurify: 3.4.17
  flatted: 3.4.2
  form-data: 4.0.6
  immutable: 4.3.9
  lodash: 4.18.1
  lodash-es: 4.18.1
  mermaid: 11.16.1
  nanoid: 3.3.18
  node-abi: ^4.31.0
  picomatch: 4.0.4
  postcss: 8.5.23
  prosemirror-model: 1.25.12
  prosemirror-transform: 1.12.4
  prosemirror-view: 1.42.8
  "@tiptap/extension-bubble-menu": 3.32.0
  "@tiptap/extension-floating-menu": 3.32.0
  rollup: 4.62.0
  sass: 1.101.0
  tar: 7.5.21
  tinypool: 2.1.2
  tmp: 0.2.7
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  yaml: 2.9.0
  "@modelcontextprotocol/sdk": 1.32.1
  "@modelcontextprotocol/sdk>hono": 4.13.11
  "@modelcontextprotocol/sdk>@hono/node-server": 2.1.3
  js-yaml: 4.3.2
  # Keep transitive math renderers on the security-patched release.
  katex: 0.19.1
  # Vite+ uses one Vitest 5 runtime; older library utilities retain patched major-4 APIs.
  "@vitest/expect@^5.0.0": 5.0.5
  "@vitest/expect@^4.0.0": 4.1.11
  "@vitest/runner@^4.0.0": 4.1.11
  "@vitest/spy@^5.0.0": 5.0.5
  "@vitest/spy@^4.0.0": 4.1.11
  "@vitest/utils@^5.0.0": 5.0.5
  "@vitest/utils@^4.0.0": 4.1.11
  "@vitest/mocker@^5.0.0": 5.0.5
  "@vitest/mocker@^4.0.0": 4.1.11
  "@vitest/browser@^5.0.0": 5.0.5
  "@vitest/browser@^4.0.0": 4.1.11
  "@vitest/snapshot@^5.0.0": 5.0.5
  "@vitest/snapshot@^4.0.0": 4.1.11
  "@vitest/pretty-format@^5.0.0": 5.0.5
  "@vitest/pretty-format@^4.0.0": 4.1.11
  "@vitest/browser-preview@^5.0.0": 5.0.5
  "@vitest/browser-preview@^4.0.0": 4.1.11

audit:
  # Packaging-only logger uses fixed format strings; see docs/SECURITY.md.
  ignore:
    - GHSA-hp3w-g68c-fv3c

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  # The repository prepares a verified, independent dist from the shared extraction cache.
  electron: false
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: false
  node-pty: true
  sharp: false
  unrs-resolver: false
  tsc-rs: true

packageExtensions:
  "@effect/vitest@4.0.3":
    peerDependencies:
      vite-plus: 1.4.0

peerDependencyRules:
  allowedVersions:
    # OpenCode shares the workspace Effect patch with its protocol/schema packages.
    "@opencode/client@2.0.23>effect": 4.0.3
  allowAny:
    # Vite+ supplies the Vite API through its own package version.
    - vite

minimumReleaseAgeExclude:
  - "@effect/platform-node-shared@4.0.3"
  - "@effect/platform-node@4.0.3"
  - effect@4.0.3
  - "@effect/vitest@4.0.3"
  - "@effect/tsgo@0.51.1"
  - "@effect/tsgo-darwin-arm64@0.51.1"
  - "@effect/tsgo-darwin-x64@0.51.1"
  - vitest@5.0.5
  - "@vitest/browser-playwright@5.0.5"
  - electron@44.9.1
  - "@vitest/browser-preview@5.0.5"
  - "@vitest/browser@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/pretty-format@5.0.5"
  - "@vitest/snapshot@5.0.5"
  - "@vitest/spy@5.0.5"
  - "@vitest/ui@5.0.5"
  - "@vitest/utils@5.0.5"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.301"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.301"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.301"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.301"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.301"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.301"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.301"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.301"
  - "@anthropic-ai/claude-agent-sdk@0.3.301"
