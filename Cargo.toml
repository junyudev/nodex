[workspace]
members = [
  "crates/nodex-browser-profile-helper",
  "crates/nodex-cli",
  "crates/nodex-core",
  "crates/nodex-core-contracts",
  "crates/nodex-core-protocol",
  "crates/nodex-markdown",
  "crates/nodex-page-search-kernel",
  "crates/nodex-profile",
  "crates/nodex-core-server",
  "crates/nodex-store-format",
  "crates/nodex-sqlite-query",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[workspace.dependencies]
nodex-profile = { path = "crates/nodex-profile" }
nodex-core = { path = "crates/nodex-core" }
nodex-core-contracts = { path = "crates/nodex-core-contracts" }
nodex-core-protocol = { path = "crates/nodex-core-protocol" }
nodex-store-format = { path = "crates/nodex-store-format" }
nodex-markdown = { path = "crates/nodex-markdown" }
nodex-page-search-kernel = { path = "crates/nodex-page-search-kernel" }
nodex-sqlite-query = { path = "crates/nodex-sqlite-query" }
async-stream = "0.3.6"
axum = "=0.8.9"
base64 = "0.23.1"
aes = "0.9.3"
cbc = "0.2.1"
chrono = "=0.4.45"
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
clap = { version = "=4.6.7", features = ["derive"] }
comrak = { version = "=0.57.0", default-features = false }
fs2 = "0.4.3"
futures-core = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
pbkdf2 = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
regex = "1.13.1"
rrule = "=0.14.0"
rusqlite = { version = "=0.41.0", default-features = false, features = [
  "backup",
  "bundled",
  "cache",
  "hooks",
  "limits",
  "trace",
  "vtab",
] }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
signal-hook = "=0.4.5"
similar = "=3.2.1"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = "=6.0.0"
unicode-segmentation = "1.13.3"
# Normalization defines persisted Page File collision keys.
unicode-normalization = "=0.1.25"
yaml-rust2 = "=0.13.0"
# Preserve Yjs numeric wire types; the checkpoint compatibility test guards upgrades.
yrs = { version = "=0.27.4", features = ["sync", "small-client"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
# Keep file/line backtraces without variable/type debug data. Set
# CARGO_PROFILE_DEV_DEBUG=full (or CARGO_PROFILE_TEST_DEBUG=full) for LLDB locals.
debug = "line-tables-only"
# Core hashes its executable at startup; keep DWARF outside that input.
split-debuginfo = "unpacked"

[profile.dev.package.sha2]
opt-level = 3

[profile.wasm-release]
# WebAssembly the app loads: small over fast, since it ships with every window.
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.release.build-override]
# Proc-macro libraries are loaded by the host compiler, never shipped. Stripping
# their Mach-O symbol tables can make them unloadable by macOS dyld.
strip = "none"
