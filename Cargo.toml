[workspace]
members = [
  "crates/nodex-browser-profile-helper",
  "crates/nodex-cli",
  "crates/nodex-core",
  "crates/nodex-core-contracts",
  "crates/nodex-core-protocol",
  "crates/nodex-page-search-kernel",
  "crates/nodex-core-server",
  "crates/nodex-store-format",
  "crates/nodex-sqlite-query",
]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
nodex-core = { path = "crates/nodex-core" }
nodex-core-contracts = { path = "crates/nodex-core-contracts" }
nodex-core-protocol = { path = "crates/nodex-core-protocol" }
nodex-store-format = { path = "crates/nodex-store-format" }
nodex-page-search-kernel = { path = "crates/nodex-page-search-kernel" }
nodex-sqlite-query = { path = "crates/nodex-sqlite-query" }
async-stream = "0.3.6"
axum = "=0.8.4"
base64 = "0.22.1"
aes = "0.8.4"
cbc = "0.1.2"
chrono = "=0.4.42"
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
clap = { version = "=4.6.3", features = ["derive"] }
fs2 = "0.4.3"
futures-core = "0.3.31"
getrandom = "0.3.4"
hex = "0.4.3"
pbkdf2 = "0.12.2"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
regex = "1.13.1"
rrule = "=0.14.0"
rusqlite = { version = "=0.40.1", default-features = false, features = [
  "backup",
  "bundled",
  "cache",
  "hooks",
  "limits",
  "trace",
  "vtab",
] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.7"
sha2 = "0.10.9"
signal-hook = "=0.4.4"
similar = "=3.1.1"
thiserror = "2.0.17"
toml = { version = "1.1.3", default-features = false, features = ["std", "serde", "parse"] }
tokio = { version = "1.52.0", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
utoipa = "=5.5.0"
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.24"
yaml-rust2 = "=0.11.0"
yrs = { version = "=0.27.3", features = ["sync", "small-client"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
# Keep full debugger information outside the executable on every host. Core
# hashes its executable at startup, so embedded DWARF must not inflate that input.
split-debuginfo = "unpacked"

[profile.dev.package.sha2]
opt-level = 3
