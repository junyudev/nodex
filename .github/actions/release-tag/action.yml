name: Create release tag
description: Create or reuse the annotated tag for an assembled Release Bundle.
inputs:
  channel:
    description: Release channel the Bundle must belong to.
    required: true
  source_sha:
    description: Exact source commit of the Release Bundle.
    required: true
  token:
    description: NODEX_RELEASE_TAG_TOKEN from the release-publish environment.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nodex-release-bundle-${{ inputs.source_sha }}
        path: ${{ runner.temp }}/release-bundle
    - shell: bash
      env:
        # A release source usually trails main, whose workflow files may have changed since.
        # GitHub refuses GITHUB_TOKEN any ref whose workflow files differ from main's, so
        # this credential, which holds Workflows write, creates the tag. Publication reuses it.
        GH_TOKEN: ${{ inputs.token }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        : "${GH_TOKEN:?Set NODEX_RELEASE_TAG_TOKEN on the release-publish environment.}"
        bundle="${RUNNER_TEMP}/release-bundle/release-bundle.json"
        test "$(node -p "require(process.argv[1]).releaseIdentity.channel" "${bundle}")" = "${CHANNEL}"
        vp run release:tag -- --repo "${GITHUB_REPOSITORY}" --bundle "${bundle}"
