name: Set up Vite+
description: Install the pinned Vite+ control plane with the repository Node.js and dependency cache.
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
      with:
        node-version-file: .node-version
        cache: true
        cache-dependency-path: pnpm-lock.yaml
        run-install: false
    - name: Verify host Node runtime
      shell: bash
      run: node scripts/verify-node-runtime.mts --exact
