name: Release

on:
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: Nightly tag to promote (blank selects the newest published Nightly)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    name: verify the immutable Nightly candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-source
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
      nightly_run_id: ${{ steps.candidate.outputs.nightly_run_id }}
      resume_run_id: ${{ steps.candidate.outputs.resume_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Resolve and verify retained artifacts against GitHub release digests
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ inputs.nightly_tag }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/nightly" --output "${RUNNER_TEMP}/candidate.json")
          if [[ -n "${NIGHTLY_TAG}" ]]; then args+=(--tag "${NIGHTLY_TAG}"); fi
          vp exec tsx scripts/release/cli.ts resolve-promotion "${args[@]}"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const { identity, stable, runId, resumeRunId, notes } = require(process.argv[1]);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, [
              `source_sha=${identity.sourceSha}`, `tag=${stable.tag}`, `version=${stable.version}`,
              `nightly_run_id=${runId}`, `resume_run_id=${resumeRunId ?? ""}`, "",
            ].join("\n"));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Promote ${identity.tag} to ${stable.tag}\n\n${notes}`);
          ' "${RUNNER_TEMP}/candidate.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-promotion-index-${{ steps.candidate.outputs.source_sha }}
          path: ${{ runner.temp }}/nightly/nodex-release-bundle-${{ steps.candidate.outputs.source_sha }}/release-bundle.json
          if-no-files-found: error
          retention-days: 14

  finalize-sparkle:
    needs: resolve
    if: needs.resolve.outputs.resume_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, windows-x64, windows-arm64]
    runs-on: macos-26
    environment: sparkle-feed-finalization
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: ./.github/actions/finalize-sparkle
        with:
          architecture: ${{ matrix.architecture }}
          channel: stable
          nightly_run_id: ${{ needs.resolve.outputs.nightly_run_id }}
          private_key: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          retention_days: 30
          source_sha: ${{ needs.resolve.outputs.source_sha }}
          version: ${{ needs.resolve.outputs.version }}

  assemble:
    needs: [resolve, finalize-sparkle]
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.finalize-sparkle.result == 'success' ||
       (needs.resolve.outputs.resume_run_id != '' && needs.finalize-sparkle.result == 'skipped'))
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_assemble-release.yml
    with:
      channel: stable
      nightly_run_id: ${{ needs.resolve.outputs.nightly_run_id }}
      resume_run_id: ${{ needs.resolve.outputs.resume_run_id }}
      retention_days: 30
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  promote:
    name: promote verified distribution
    needs: [resolve, assemble]
    # A resumed promotion skips feed finalization; a skipped ancestor would otherwise skip this job.
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    permissions:
      attestations: read
      contents: write
    uses: ./.github/workflows/_promote-release.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      version: ${{ needs.resolve.outputs.version }}
      tag: ${{ needs.resolve.outputs.tag }}
    secrets:
      homebrew_github_token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      landing_github_token: ${{ secrets.NODEXAPP_GITHUB_IO_TOKEN }}
      skills_github_token: ${{ secrets.NODEX_SKILLS_GITHUB_TOKEN }}

  testflight:
    name: publish Nodex Mobile to TestFlight
    needs: [resolve, promote]
    if: ${{ !cancelled() && needs.promote.result == 'success' }}
    runs-on: macos-26
    environment: testflight
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nodex-release-bundle-${{ needs.resolve.outputs.source_sha }}
          path: ${{ runner.temp }}/release-bundle
      - name: Publish the certified iOS build
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          vp run release:publish:testflight -- \
            --bundle "${RUNNER_TEMP}/release-bundle/release-bundle.json" --channel stable \
            --output "${RUNNER_TEMP}/testflight.json"
          {
            echo "## TestFlight"
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/testflight.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  advance:
    name: roll release notes into main and deploy the changelog
    needs: [resolve, promote]
    if: ${{ !cancelled() && needs.promote.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      STABLE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Advance main and dispatch the landing deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          vp run release:advance -- "${STABLE_TAG}" --repo "${GITHUB_REPOSITORY}"
          gh workflow run deploy-landing-site.yml --repo "${GITHUB_REPOSITORY}" --ref main
      - name: Print recovery commands
        if: failure()
        shell: bash
        run: |
          printf 'From a clean main checkout, run:\n  vp run release:advance -- %s --repo %s\n  gh workflow run deploy-landing-site.yml --repo %s --ref main\n' \
            "${STABLE_TAG}" "${GITHUB_REPOSITORY}" "${GITHUB_REPOSITORY}" >> "${GITHUB_STEP_SUMMARY}"
