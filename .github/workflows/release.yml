name: Release

on:
  workflow_run:
    workflows: [Main CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  detect:
    name: detect protected release transition
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Verify source SHA is reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...main" \
            --jq .status)"
          if [[ "${status}" != "ahead" && "${status}" != "identical" ]]; then
            echo "CI source ${SOURCE_SHA} is not reachable from protected main." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile

      - name: Detect metadata-only version transition
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          parents="$(git rev-list --parents -n 1 "${SOURCE_SHA}")"
          if [[ "$(wc -w <<< "${parents}" | tr -d ' ')" != "2" ]]; then
            echo "Release detection requires one linear parent." >&2
            exit 1
          fi
          base_sha="${parents#* }"
          result="${RUNNER_TEMP}/release-transition.json"
          vp run release:detect -- \
            --base "${base_sha}" \
            --head "${SOURCE_SHA}" \
            --output "${result}"
          identity="${RUNNER_TEMP}/release-identity.json"
          if [[ "$(node -p "require('${result}').shouldRelease")" == "true" ]]; then
            vp run release:resolve:stable -- --base "${base_sha}" --head "${SOURCE_SHA}" --output "${identity}"
          fi
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const output = [`should_release=${result.shouldRelease}`, `source_sha=${process.env.SOURCE_SHA}`];
            if (result.shouldRelease) {
              const identity = require(`${process.env.RUNNER_TEMP}/release-identity.json`);
              output.push(`tag=${identity.tag}`, `version=${identity.version}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Release detection\n\n\`\`\`json\n${JSON.stringify(result, null, 2)}\n\`\`\`\n`);
          ' "${result}"
          if [[ "$(node -p "require('${result}').shouldRelease")" == "true" ]]; then
            version="$(node -p "require('${result}').version")"
            vp run release:check:remote -- \
              --repo "${GITHUB_REPOSITORY}" \
              --source-sha "${SOURCE_SHA}" \
              --version "${version}"
          fi

      - name: Upload Release Identity
        if: steps.release.outputs.should_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodex-release-identity-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release-identity.json
          if-no-files-found: error
          retention-days: 30

  certification:
    name: certify exact release source
    if: needs.detect.outputs.should_release == 'true'
    needs: detect
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_certify-release-source.yml
    with:
      source_sha: ${{ needs.detect.outputs.source_sha }}

  distribution:
    name: build native distributions
    if: needs.detect.outputs.should_release == 'true'
    needs: [detect, certification]
    permissions:
      contents: read
    uses: ./.github/workflows/_macos-distribution.yml
    with:
      source_sha: ${{ needs.detect.outputs.source_sha }}
      source_tree: ${{ needs.certification.outputs.source_tree }}
      version: ${{ needs.detect.outputs.version }}
      tag: ${{ needs.detect.outputs.tag }}
      retention_days: 30
      upload_sentry_sourcemaps: true
    secrets:
      apple_api_issuer: ${{ secrets.APPLE_API_ISSUER }}
      apple_api_key_b64: ${{ secrets.APPLE_API_KEY_B64 }}
      apple_api_key_id: ${{ secrets.APPLE_API_KEY_ID }}
      csc_key_password: ${{ secrets.CSC_KEY_PASSWORD }}
      csc_link: ${{ secrets.CSC_LINK }}
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      sentry_org: ${{ secrets.SENTRY_ORG }}
      sentry_project: ${{ secrets.SENTRY_PROJECT }}

  finalize-sparkle:
    name: finalize arm64 Sparkle updates
    if: needs.detect.outputs.should_release == 'true'
    needs: [detect, distribution]
    runs-on: macos-26
    environment: sparkle-feed-finalization
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.detect.outputs.source_sha }}
      - uses: ./.github/actions/finalize-sparkle
        with:
          architecture: arm64
          channel: stable
          private_key: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          retention_days: 30
          source_sha: ${{ needs.detect.outputs.source_sha }}
          version: ${{ needs.detect.outputs.version }}

  assemble:
    name: assemble verified Release Bundle
    if: needs.detect.outputs.should_release == 'true'
    needs: [detect, distribution, finalize-sparkle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_assemble-release.yml
    with:
      retention_days: 30
      source_sha: ${{ needs.detect.outputs.source_sha }}
      version: ${{ needs.detect.outputs.version }}

  promote:
    name: promote verified distribution
    if: needs.detect.outputs.should_release == 'true'
    needs: [detect, assemble]
    permissions:
      attestations: read
      contents: write
    uses: ./.github/workflows/_promote-release.yml
    with:
      source_sha: ${{ needs.detect.outputs.source_sha }}
      version: ${{ needs.detect.outputs.version }}
      tag: ${{ needs.detect.outputs.tag }}
    secrets:
      homebrew_github_token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      landing_github_token: ${{ secrets.NODEXAPP_GITHUB_IO_TOKEN }}
      skills_github_token: ${{ secrets.NODEX_SKILLS_GITHUB_TOKEN }}
