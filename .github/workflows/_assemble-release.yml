name: Assemble Release Bundle

on:
  workflow_call:
    inputs:
      retention_days:
        description: Release Bundle artifact retention period
        required: true
        type: number
      source_sha:
        description: Exact protected-main source commit
        required: true
        type: string
      version:
        description: Stable application version
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  guard:
    name: verify protected-main source
    runs-on: ubuntu-latest
    environment: release-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: main }
      - uses: ./.github/actions/verify-protected-main-source
        with:
          source_sha: ${{ inputs.source_sha }}

  assemble:
    name: assemble Release Bundle
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodex-macos-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/architectures/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodex-sparkle-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/updates/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodex-release-identity-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/identity
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodex-source-certification-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/certification

      - name: Assemble and verify Release Bundle
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/release-bundle"
          identity="${RUNNER_TEMP}/identity/release-identity.json"
          vp run release:assemble -- \
            --arm64-dir "${RUNNER_TEMP}/architectures/arm64" \
            --arm64-update-dir "${RUNNER_TEMP}/updates/arm64" \
            --identity "${identity}" \
            --output "${bundle}"
          node -e '
            const certificate = require(process.argv[1]);
            if (certificate.schemaVersion !== 1 || certificate.sourceSha !== process.env.SOURCE_SHA) {
              throw new Error("Release Bundle certification does not match its exact source");
            }
          ' "${RUNNER_TEMP}/certification/source-certification.json"
          cp "${RUNNER_TEMP}/certification/source-certification.json" \
            "${bundle}/source-certification.json"
          channel="$(node -e 'const channel = require(process.argv[1]).channel; process.stdout.write(typeof channel === "string" ? channel : "")' "${identity}")"
          if [[ "${channel}" == "stable" ]]; then
            vp run release:notes -- --version "${VERSION}" --output "${bundle}/release-notes.md"
          elif [[ "${channel}" == "nightly" ]]; then
            printf 'Nightly build from `%s`.\n' "${SOURCE_SHA}" > "${bundle}/release-notes.md"
          else
            echo "Unknown release channel: ${channel}" >&2
            exit 1
          fi
          {
            echo "## Verified Release Bundle"
            echo
            echo '```json'
            cat "${bundle}/release-bundle.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload verified Release Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodex-release-bundle-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-bundle/
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
