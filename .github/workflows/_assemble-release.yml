name: Assemble Release Bundle

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      nightly_run_id:
        default: ""
        type: string
      resume_run_id:
        default: ""
        type: string
      rehearsal:
        default: false
        type: boolean
      retention_days:
        description: Release Bundle artifact retention period
        required: true
        type: number
      source_sha:
        description: Exact protected-main source commit
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  assemble:
    name: assemble Release Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id == ''
        with:
          name: nodex-macos-arm64-${{ inputs.source_sha }}
          github-token: ${{ inputs.nightly_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.nightly_run_id || github.run_id }}
          path: ${{ runner.temp }}/architectures/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id == ''
        with:
          name: nodex-sparkle-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/updates/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id == ''
        with:
          name: nodex-windows-x64-${{ inputs.source_sha }}
          github-token: ${{ inputs.nightly_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.nightly_run_id || github.run_id }}
          path: ${{ runner.temp }}/architectures/windows-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id == ''
        with:
          name: nodex-sparkle-windows-x64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/updates/windows-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id == ''
        with:
          name: nodex-windows-arm64-${{ inputs.source_sha }}
          github-token: ${{ inputs.nightly_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.nightly_run_id || github.run_id }}
          path: ${{ runner.temp }}/architectures/windows-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id == ''
        with:
          name: nodex-sparkle-windows-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/updates/windows-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id == ''
        with:
          name: nodex-mobile-android-${{ inputs.source_sha }}
          github-token: ${{ inputs.nightly_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.nightly_run_id || github.run_id }}
          path: ${{ runner.temp }}/mobile/android
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id == ''
        with:
          name: nodex-mobile-ios-${{ inputs.source_sha }}
          github-token: ${{ inputs.nightly_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.nightly_run_id || github.run_id }}
          path: ${{ runner.temp }}/mobile/ios
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id == ''
        with:
          name: nodex-build-identity-${{ inputs.source_sha }}
          github-token: ${{ inputs.nightly_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.nightly_run_id || github.run_id }}
          path: ${{ runner.temp }}/identity
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id == ''
        with:
          name: nodex-source-certification-${{ inputs.source_sha }}
          github-token: ${{ inputs.nightly_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.nightly_run_id || github.run_id }}
          path: ${{ runner.temp }}/certification

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.resume_run_id != ''
        with:
          name: nodex-release-bundle-${{ inputs.source_sha }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.nightly_run_id != ''
        with:
          name: nodex-promotion-index-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/promotion-index

      - name: Assemble Release Bundle
        if: inputs.resume_run_id == ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHANNEL: ${{ inputs.channel }}
          REHEARSAL: ${{ inputs.rehearsal }}
          SOURCE_RUN_ID: ${{ inputs.nightly_run_id || github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/release-bundle"
          identity="${RUNNER_TEMP}/identity/build-identity.json"
          vp run release:assemble -- \
            --arm64-dir "${RUNNER_TEMP}/architectures/arm64" \
            --arm64-update-dir "${RUNNER_TEMP}/updates/arm64" \
            --windows-x64-dir "${RUNNER_TEMP}/architectures/windows-x64" \
            --windows-arm64-dir "${RUNNER_TEMP}/architectures/windows-arm64" \
            --windows-x64-update-dir "${RUNNER_TEMP}/updates/windows-x64" \
            --windows-arm64-update-dir "${RUNNER_TEMP}/updates/windows-arm64" \
            --android-dir "${RUNNER_TEMP}/mobile/android" \
            --ios-dir "${RUNNER_TEMP}/mobile/ios" \
            --channel "${CHANNEL}" --identity "${identity}" \
            --output "${bundle}"
          vp exec tsx scripts/release/cli.ts verify-certificate --identity "${identity}" \
            --certificate "${RUNNER_TEMP}/certification/source-certification.json" --run-id "${SOURCE_RUN_ID}"
          cp "${RUNNER_TEMP}/certification/source-certification.json" "${bundle}/source-certification.json"
          if [[ "${CHANNEL}" == "stable" && "${REHEARSAL}" != "true" ]]; then
            git show "${SOURCE_SHA}:CHANGELOG.md" > "${RUNNER_TEMP}/CHANGELOG.md"
            vp run release:notes -- --changelog "${RUNNER_TEMP}/CHANGELOG.md" --output "${bundle}/release-notes.md"
          else
            # shellcheck disable=SC2016
            printf 'Build from `%s`.\n' "${SOURCE_SHA}" > "${bundle}/release-notes.md"
          fi
          {
            echo "## Verified Release Bundle"
            echo
            echo '```json'
            cat "${bundle}/release-bundle.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify stable build bytes against the published Nightly
        if: inputs.nightly_run_id != ''
        run: |
          vp exec tsx scripts/release/cli.ts verify-promotion \
            --nightly "${RUNNER_TEMP}/promotion-index/release-bundle.json" \
            --bundle "${RUNNER_TEMP}/release-bundle/release-bundle.json"

      - name: Upload verified Release Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-release-bundle-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-bundle/
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
