name: Main CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every deterministic source gate
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.base_sha }}
      changed_paths: ${{ steps.outputs.outputs.changed_paths }}
      plan: ${{ steps.outputs.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve comparison base
        id: base
        env:
          EVENT_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${EVENT_BASE_SHA}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="${HEAD_SHA}"
            if git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
              base_sha="$(git rev-parse "${HEAD_SHA}^")"
            fi
          fi
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
      - uses: ./.github/actions/setup-vite-plus
      - name: Classify the landed change
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--base "${BASE_SHA}" --head "${HEAD_SHA}" --output "${RUNNER_TEMP}/classification.json")
          if [[ "${FORCE_FULL}" == "true" ]]; then
            arguments+=(--full)
          fi
          node --no-warnings scripts/ci/classify-change.ts "${arguments[@]}"
      - name: Publish typed gate plan
        id: outputs
        run: node --no-warnings scripts/ci/write-github-outputs.ts --input "${RUNNER_TEMP}/classification.json"

  release-transition:
    name: release transition
    if: ${{ fromJSON(needs.classify.outputs.plan).releaseTransition }}
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile --ignore-scripts
      - name: Verify landed release metadata
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: vp run release:detect -- --base "${BASE_SHA}" --head "${HEAD_SHA}" --output "${RUNNER_TEMP}/release-transition.json"

  static-contracts:
    name: main static contracts
    if: ${{ toJSON(fromJSON(needs.classify.outputs.plan).staticGroups) != '[]' }}
    needs: classify
    uses: ./.github/workflows/_static-checks.yml
    with:
      groups_json: ${{ toJSON(fromJSON(needs.classify.outputs.plan).staticGroups) }}
      timing_prefix: main-static

  rust-checks:
    name: main rust checks
    if: ${{ fromJSON(needs.classify.outputs.plan).rustFast || fromJSON(needs.classify.outputs.plan).protocolContracts || fromJSON(needs.classify.outputs.plan).rustMigration }}
    needs: classify
    uses: ./.github/workflows/_rust-checks.yml
    with:
      changed_paths_json: ${{ needs.classify.outputs.changed_paths }}
      full_workspace: ${{ fromJSON(needs.classify.outputs.plan).rustFull }}
      run_fast: ${{ fromJSON(needs.classify.outputs.plan).rustFast }}
      run_migration: ${{ fromJSON(needs.classify.outputs.plan).rustMigration }}
      run_protocol: ${{ fromJSON(needs.classify.outputs.plan).protocolContracts }}
      timing_prefix: main-rust

  app-tests:
    name: main app tests
    if: ${{ toJSON(fromJSON(needs.classify.outputs.plan).appTestSuites) != '[]' }}
    needs: classify
    uses: ./.github/workflows/_app-tests.yml
    with:
      gate_plan_json: ${{ needs.classify.outputs.plan }}
      suites_json: ${{ toJSON(fromJSON(needs.classify.outputs.plan).appTestSuites) }}
      timing_prefix: main-app

  complete:
    name: main complete
    if: always()
    needs:
      - classify
      - release-transition
      - static-contracts
      - rust-checks
      - app-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - name: Require every selected main gate
        env:
          CI_GATE_PLAN_JSON: ${{ needs.classify.outputs.plan }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --no-warnings scripts/ci/verify-required-gates.ts
