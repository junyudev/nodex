name: Main CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every deterministic source gate
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

# Let the active push finish and keep only the newest pending push. Comparing against the last
# green commit covers intervening changes even when GitHub replaces a pending run. Manual runs
# have independent groups.
concurrency:
  group: ${{ github.event_name == 'push' && format('main-ci-{0}', github.ref) || format('main-ci-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.base_sha }}
      changed_paths: ${{ steps.outputs.outputs.changed_paths }}
      plan: ${{ steps.outputs.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve comparison base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --no-warnings scripts/ci/resolve-main-ci-base.ts
      - name: Classify the landed change
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--head "${HEAD_SHA}" --output "${RUNNER_TEMP}/classification.json")
          if [[ -n "${BASE_SHA}" && "${FORCE_FULL}" != "true" ]]; then
            arguments+=(--base "${BASE_SHA}")
          else
            arguments+=(--full)
          fi
          node --no-warnings scripts/ci/classify-change.ts "${arguments[@]}"
      - name: Publish typed gate plan
        id: outputs
        run: node --no-warnings scripts/ci/write-github-outputs.ts --input "${RUNNER_TEMP}/classification.json"

  static-contracts:
    name: main static contracts
    if: ${{ toJSON(fromJSON(needs.classify.outputs.plan).staticGroups) != '[]' }}
    needs: classify
    uses: ./.github/workflows/_static-checks.yml
    with:
      groups_json: ${{ toJSON(fromJSON(needs.classify.outputs.plan).staticGroups) }}
      timing_prefix: main-static

  rust-checks:
    name: main rust checks
    if: ${{ fromJSON(needs.classify.outputs.plan).rustFast || fromJSON(needs.classify.outputs.plan).protocolContracts || fromJSON(needs.classify.outputs.plan).rustMigration }}
    needs: classify
    uses: ./.github/workflows/_rust-checks.yml
    with:
      changed_paths_json: ${{ needs.classify.outputs.changed_paths }}
      full_workspace: ${{ fromJSON(needs.classify.outputs.plan).rustFull }}
      run_fast: ${{ fromJSON(needs.classify.outputs.plan).rustFast }}
      run_migration: ${{ fromJSON(needs.classify.outputs.plan).rustMigration }}
      run_protocol: ${{ fromJSON(needs.classify.outputs.plan).protocolContracts }}
      timing_prefix: main-rust

  app-tests:
    name: main app tests
    if: ${{ toJSON(fromJSON(needs.classify.outputs.plan).appTestSuites) != '[]' }}
    needs: classify
    uses: ./.github/workflows/_app-tests.yml
    with:
      gate_plan_json: ${{ needs.classify.outputs.plan }}
      suites_json: ${{ toJSON(fromJSON(needs.classify.outputs.plan).appTestSuites) }}
      timing_prefix: main-app

  windows-checks:
    name: main windows checks
    if: ${{ fromJSON(needs.classify.outputs.plan).windowsChecks }}
    needs: classify
    uses: ./.github/workflows/_windows-checks.yml

  complete:
    name: main complete
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    needs:
      - classify
      - static-contracts
      - rust-checks
      - app-tests
      - windows-checks
    runs-on: ubuntu-latest
    env:
      CI_GATE_PLAN_JSON: ${{ needs.classify.outputs.plan }}
      CI_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every selected main gate
        id: verify
        run: node --no-warnings scripts/ci/verify-required-gates.ts
      - name: Write Main CI verdict
        id: verdict
        if: always()
        env:
          CI_BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_GATE_OUTCOME: ${{ steps.verify.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: node --no-warnings scripts/ci/write-main-ci-verdict.ts
      - name: Upload Main CI verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-ci-verdict
          path: ${{ runner.temp }}/main-ci-verdict.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Update the red-main issue
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.verdict.outcome == 'success' && (steps.verify.outcome == 'failure' || success()) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_GATE_OUTCOME: ${{ steps.verify.outcome }}
        run: node --no-warnings scripts/ci/update-main-ci-issue.ts
