name: Promote Nightly Release

on:
  workflow_call:
    inputs:
      source_sha: { required: true, type: string }
      tag: { required: true, type: string }
      version: { required: true, type: string }

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: "${{ github.workflow_sha }}" }
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            name: "nodex-release-bundle-${{ inputs.source_sha }}",
            path: "${{ runner.temp }}/release-bundle",
          }
      - name: Publish exact prerelease bytes
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/release-bundle/release-bundle.json"
          test "$(node -p "require('${bundle}').releaseIdentity.channel")" = nightly
          vp run release:tag -- --repo "${GITHUB_REPOSITORY}" --bundle "${bundle}"
          vp run release:publish:github -- --repo "${GITHUB_REPOSITORY}" --bundle "${bundle}" --notes "${RUNNER_TEMP}/release-bundle/release-notes.md"
          vp run release:verify:remote -- --repo "${GITHUB_REPOSITORY}" --bundle "${bundle}"

  feed:
    needs: publish
    runs-on: ubuntu-latest
    environment: release-r2-publish
    concurrency:
      group: release-r2-nightly
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodex-release-bundle-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-bundle
      - name: Publish release assets and appcasts
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/release-bundle/release-bundle.json"
          test "$(node -p "require('${bundle}').releaseIdentity.channel")" = nightly
          vp run release:publish:r2 -- --bundle "${bundle}"
          vp run release:publish:feeds -- --bundle "${bundle}"
      - name: Verify public appcasts and downloads
        run: vp run release:verify:feeds -- --bundle "${{ runner.temp }}/release-bundle/release-bundle.json"
