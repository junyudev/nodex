name: Promote Nightly Release

on:
  workflow_call:
    inputs:
      source_sha: { required: true, type: string }
      tag: { required: true, type: string }
      version: { required: true, type: string }
    secrets:
      landing_github_token: { required: true }

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: "${{ inputs.source_sha }}" }
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          {
            name: "nodex-release-bundle-${{ inputs.source_sha }}",
            path: "${{ runner.temp }}/release-bundle",
          }
      - name: Publish exact prerelease bytes
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/release-bundle/release-bundle.json"
          test "$(node -p "require('${bundle}').releaseIdentity.channel")" = nightly
          vp run release:tag -- --repo "${GITHUB_REPOSITORY}" --bundle "${bundle}"
          vp run release:publish:github -- --repo "${GITHUB_REPOSITORY}" --bundle "${bundle}" --notes "${RUNNER_TEMP}/release-bundle/release-notes.md"
          vp run release:verify:remote -- --repo "${GITHUB_REPOSITORY}" --bundle "${bundle}"

  feed:
    needs: publish
    runs-on: ubuntu-latest
    environment: landing-production
    concurrency:
      group: release-site-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "${{ inputs.source_sha }}" }
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          {
            name: "nodex-release-bundle-${{ inputs.source_sha }}",
            path: "${{ runner.temp }}/release-bundle",
          }
      - name: Project only the nightly feed subtree
        env:
          GH_TOKEN: "${{ secrets.landing_github_token }}"
          VERSION: "${{ inputs.version }}"
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          target="${RUNNER_TEMP}/target-site"
          git clone https://github.com/NodexApp/NodexApp.github.io.git "${target}"
          vp run release:project:pages -- --bundle "${RUNNER_TEMP}/release-bundle/release-bundle.json" --existing-site-dir "${target}" --site-dir "${target}"
          git -C "${target}" add updates/nightly
          if git -C "${target}" diff --cached --quiet; then exit 0; fi
          git -C "${target}" config user.name github-actions[bot]
          git -C "${target}" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "${target}" commit -m "deploy: publish Nodex ${VERSION} nightly feed"
          git -C "${target}" push origin HEAD
          vp run release:verify:pages -- --bundle "${RUNNER_TEMP}/release-bundle/release-bundle.json"
