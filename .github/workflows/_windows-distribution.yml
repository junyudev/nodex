name: Windows Distribution

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to build
        required: true
        type: string
      source_tree:
        description: Certified Git tree required for official distribution
        default: ""
        type: string
      release:
        description: Consume certified Release Identity and enable its update channel
        default: true
        type: boolean
      retention_days:
        default: 14
        type: number
      installer_run_id:
        description: Reprobe existing installers without rebuilding (diagnostics only)
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  installer:
    name: installer ${{ matrix.arch }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      DIAGNOSTIC_INSTALLER_RUN_ID: ${{ inputs.installer_run_id }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_SOURCE_TREE: ${{ inputs.source_tree }}
      BUILD_IDENTITY_PATH: ${{ github.workspace }}/.generated/release-inputs/identity/build-identity.json
      RELEASE_OUTPUT: ${{ github.workspace }}/.generated/release-architecture/windows-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - uses: ./.github/actions/setup-windows-rust
      - run: vp install --frozen-lockfile
      - name: Require native Node
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.platform !== 'win32' || process.arch !== process.env.RELEASE_ARCH) throw new Error('Packaging requires native Windows Node')"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.release
        with:
          name: nodex-build-identity-${{ inputs.source_sha }}
          path: ${{ github.workspace }}/.generated/release-inputs/identity
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.release
        with:
          name: nodex-source-certification-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/certification
      - name: Verify certified source before official distribution
        if: inputs.release
        shell: pwsh
        run: |
          if ($env:DIAGNOSTIC_INSTALLER_RUN_ID -ne '') { throw 'Official builds cannot reuse diagnostic installers' }
          vp exec tsx scripts/release/cli.ts verify-certificate --identity "$env:BUILD_IDENTITY_PATH" --certificate "$env:RUNNER_TEMP/certification/source-certification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          vp run release:verify:identity -- --identity "$env:BUILD_IDENTITY_PATH" --head "$env:RELEASE_SOURCE_SHA"
      - name: Resolve validation identity with updates disabled
        if: ${{ !inputs.release && inputs.installer_run_id == '' }}
        run: vp run release:resolve:source -- --head "$env:RELEASE_SOURCE_SHA" --output "$env:BUILD_IDENTITY_PATH"
      - name: Build, package, probe, and record native distribution
        if: inputs.installer_run_id == ''
        run: >-
          vp exec tsx scripts/release/cli.ts build-windows
          --arch ${{ matrix.arch }} --identity "$env:BUILD_IDENTITY_PATH"
          --release ${{ inputs.release }} --output "$env:RELEASE_OUTPUT"
      - name: Report installed Desktop Tool conformance
        if: inputs.installer_run_id == ''
        env:
          DESKTOP_TOOLS_ARCH: ${{ matrix.arch }}
        run: |
          $probe = Get-Content -Raw "$env:RELEASE_OUTPUT/installed-app-probe.json" | ConvertFrom-Json
          switch ($probe.desktopTools.status) {
            'passed' {
              "Desktop Tools ($env:DESKTOP_TOOLS_ARCH): installed REPL passed, $($probe.desktopTools.signedImages) vendor signatures verified, $($probe.desktopTools.processesClosed) processes closed" >> $env:GITHUB_STEP_SUMMARY
            }
            'skipped: no published runtime' {
              "Desktop Tools ($env:DESKTOP_TOOLS_ARCH): skipped: no published runtime" >> $env:GITHUB_STEP_SUMMARY
            }
            default { throw 'Missing installed Desktop Tool conformance result' }
          }
      - name: Carry source certification
        if: inputs.release
        run: Copy-Item "$env:RUNNER_TEMP/certification/source-certification.json" "$env:RELEASE_OUTPUT/source-certification.json"
      - name: Upload verified architecture bundle
        if: inputs.installer_run_id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-windows-${{ matrix.arch }}-${{ inputs.source_sha }}
          path: ${{ env.RELEASE_OUTPUT }}/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0
      - name: Download existing installer for diagnosis
        if: inputs.installer_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.installer_run_id }}
          pattern: nodex-windows-${{ matrix.arch }}-*
          path: dist
          merge-multiple: true
      - name: Verify graceful Core maintenance
        if: inputs.installer_run_id != ''
        run: vp run test:core-client src/main/core-client/core-client.node.test.ts -t 'Windows maintenance gracefully drains installed Core'
      - name: Verify installer process and listener boundaries
        if: inputs.installer_run_id != ''
        run: vp run test:unit scripts/windows-installation-processes.test.ts
      - name: Reprobe the installed application
        if: inputs.installer_run_id != ''
        run: vp exec tsx scripts/ci/probe-windows-installer.ts --arch ${{ matrix.arch }} --artifacts .generated/windows-probe
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-windows-probe-${{ matrix.arch }}-${{ inputs.source_sha }}
          path: .generated/windows-probe/artifacts/
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention_days }}
