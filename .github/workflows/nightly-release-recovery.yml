name: Nightly Release Recovery

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main Nightly source commit
        required: true
        type: string
      tag:
        description: Exact immutable Nightly tag
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-nightly
  cancel-in-progress: false
  queue: max

jobs:
  guard:
    name: require protected-main source
    runs-on: ubuntu-latest
    environment: release-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: main }
      - uses: ./.github/actions/verify-protected-main-source
        with:
          source_sha: ${{ inputs.source_sha }}

  restore:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: "${{ inputs.source_sha }}" }
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Restore retained bundle or immutable release assets
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/release-bundle"
          mkdir -p "${root}"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=nodex-release-bundle-${SOURCE_SHA}&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [[ -n "${artifact_id}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${RUNNER_TEMP}/bundle.zip"
            unzip -q "${RUNNER_TEMP}/bundle.zip" -d "${root}"
          else
            gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${root}"
          fi
          bundle="$(find "${root}" -name release-bundle.json -type f -print -quit)"
          test -n "${bundle}"
          if [[ "$(dirname "${bundle}")" != "${root}" ]]; then cp -R "$(dirname "${bundle}")/." "${root}/"; fi
          node -e '
            const b = require(process.argv[1]);
            if (b.sourceSha !== process.env.SOURCE_SHA || b.tag !== process.env.TAG || b.releaseIdentity.channel !== "nightly") {
              throw new Error("Recovered bundle is not the requested Nightly identity");
            }
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `version=${b.version}\n`);
          ' "${root}/release-bundle.json"
          vp run release:verify:bundle -- --bundle "${root}/release-bundle.json"
          test -f "${root}/release-notes.md" || printf 'Recovered Nightly `%s`.\n' "${TAG}" > "${root}/release-notes.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodex-release-bundle-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-bundle/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: restore
    permissions:
      attestations: read
      contents: write
    uses: ./.github/workflows/_promote-nightly.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      tag: ${{ inputs.tag }}
      version: ${{ needs.restore.outputs.version }}
    secrets:
      landing_github_token: ${{ secrets.NODEXAPP_GITHUB_IO_TOKEN }}
