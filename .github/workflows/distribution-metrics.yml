name: Distribution Metrics

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: distribution-metrics
  cancel-in-progress: false

jobs:
  report:
    # Each run compares against the snapshot the previous default-branch run saved.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # A run saves its snapshot only after Statsig accepts the report, so the newest snapshot
      # artifact is the comparison point. When none is left, the run records a baseline.
      - name: Find the previous snapshot
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=distribution-metrics-snapshot&per_page=1" \
            --jq '.artifacts[0] | select(. != null and (.expired | not)) | "run_id=\(.workflow_run.id)\nartifact_id=\(.id)"' \
            >> "${GITHUB_OUTPUT}"
      - name: Restore the previous snapshot
        if: steps.previous.outputs.artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}
          artifact-ids: ${{ steps.previous.outputs.artifact_id }}
          path: ${{ runner.temp }}/distribution-metrics
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Report daily downloads and update-feed requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          mkdir -p "${RUNNER_TEMP}/distribution-metrics"
          vp run analytics:distribution --state "${RUNNER_TEMP}/distribution-metrics/snapshot.json" | tee -a "${GITHUB_STEP_SUMMARY}"
      # A rerun of a delivered run replaces its own snapshot instead of failing on the name.
      - name: Save the snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-metrics-snapshot
          path: ${{ runner.temp }}/distribution-metrics/snapshot.json
          if-no-files-found: error
          overwrite: true
