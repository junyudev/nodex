name: Distribution Metrics

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-metrics
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      # The previous snapshot is only a comparison point. If the cache is ever evicted, the next
      # run records a new baseline and no history in Statsig is affected.
      - name: Restore the previous snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .distribution-metrics/snapshot.json
          key: distribution-metrics-${{ github.run_id }}
          restore-keys: distribution-metrics-
      - name: Report daily downloads and update-feed requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          mkdir -p .distribution-metrics
          vp run analytics:distribution --state .distribution-metrics/snapshot.json | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Save the snapshot
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .distribution-metrics/snapshot.json
          key: distribution-metrics-${{ github.run_id }}
