name: Nightly Reliability CI

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-ci
  cancel-in-progress: false

jobs:
  static-contracts:
    name: nightly static contracts
    uses: ./.github/workflows/_static-checks.yml
    with:
      groups_json: '["types","ui-contracts","ci-contracts","repository-contracts","generated","landing"]'
      timing_prefix: nightly-static

  rust-checks:
    name: nightly rust checks
    uses: ./.github/workflows/_rust-checks.yml
    with:
      full_workspace: true
      run_fast: true
      run_migration: true
      run_protocol: true
      timing_prefix: nightly-rust

  app-tests:
    name: nightly application and browser tests
    uses: ./.github/workflows/_app-tests.yml
    with:
      gate_plan_json: '{"allGates":true,"appTestSuites":["unit","effect-codex","core-client","main","renderer","integration","browser"],"dependencyKind":"source","docsOnly":false,"landingOnly":false,"protocolContracts":true,"relatedPaths":[],"releaseTransition":false,"rustFast":true,"rustFull":true,"rustMigration":true,"staticGroups":["types","ui-contracts","ci-contracts","repository-contracts","generated","landing"],"testMode":"full"}'
      suites_json: '["unit","effect-codex","core-client","main","renderer","integration","browser"]'
      timing_prefix: nightly-app

  stress:
    name: nightly stress suite
    runs-on: ubuntu-latest
    env:
      CI_TIMING_JOB: nightly-stress
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-stress-tests

  runtime-contracts:
    name: nightly macOS runtime contracts
    runs-on: macos-26
    env:
      CI_TIMING_JOB: nightly-runtime
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: ./.github/actions/setup-rust-ci
      - run: vp exec tsx scripts/ci/run-timed.ts --name runtime-contracts -- vp run verify:runtime:mac
      - if: always()
        run: sccache --show-stats || true

  complete:
    name: nightly complete
    if: always()
    needs:
      - static-contracts
      - rust-checks
      - app-tests
      - stress
      - runtime-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every nightly gate
        env:
          CI_CLASSIFIER_RESULT: success
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --no-warnings scripts/ci/verify-required-gates.ts
