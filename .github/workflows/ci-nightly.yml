name: Nightly Reliability CI

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-ci
  cancel-in-progress: false

jobs:
  plan:
    uses: ./.github/workflows/_full-ci-plan.yml
    with:
      source_sha: ${{ github.sha }}

  static-contracts:
    name: nightly static contracts
    needs: plan
    uses: ./.github/workflows/_static-checks.yml
    with:
      groups_json: ${{ toJSON(fromJSON(needs.plan.outputs.plan).staticGroups) }}
      timing_prefix: nightly-static

  rust-checks:
    name: nightly rust checks
    needs: plan
    uses: ./.github/workflows/_rust-checks.yml
    with:
      full_workspace: ${{ fromJSON(needs.plan.outputs.plan).rustFull }}
      run_fast: ${{ fromJSON(needs.plan.outputs.plan).rustFast }}
      run_protocol: ${{ fromJSON(needs.plan.outputs.plan).protocolContracts }}
      timing_prefix: nightly-rust

  app-tests:
    name: nightly application and browser tests
    needs: plan
    uses: ./.github/workflows/_app-tests.yml
    with:
      gate_plan_json: ${{ needs.plan.outputs.plan }}
      suites_json: ${{ toJSON(fromJSON(needs.plan.outputs.plan).appTestSuites) }}
      timing_prefix: nightly-app

  app-tests-macos:
    name: nightly macOS application and browser tests
    needs: plan
    uses: ./.github/workflows/_app-tests.yml
    with:
      gate_plan_json: ${{ needs.plan.outputs.plan }}
      suites_json: ${{ toJSON(fromJSON(needs.plan.outputs.plan).appTestSuites) }}
      runner: macos-26
      # Stress, runtime contracts, and Electron E2E can occupy the other three macOS slots.
      max_parallel: 2
      timing_prefix: nightly-app-macos

  app-nightly:
    name: nightly application test tier
    runs-on: ubuntu-latest
    env:
      CI_TIMING_JOB: nightly-app-nightly
      NODEX_TEST_TIMINGS: .generated/ci-timings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-nightly-tests
      - name: Upload nightly application timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-nightly-app-nightly-${{ github.run_attempt }}
          path: .generated/ci-timings/
          if-no-files-found: ignore
          retention-days: 14

  stress:
    name: nightly stress suite
    runs-on: macos-26
    env:
      CI_TIMING_JOB: nightly-stress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-stress-tests

  runtime-contracts:
    name: nightly macOS runtime contracts
    runs-on: macos-26
    env:
      CI_TIMING_JOB: nightly-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: ./.github/actions/setup-rust-ci
      - run: vp exec tsx scripts/ci/run-timed.ts --name runtime-contracts -- vp run verify:runtime:mac
      - name: Upload ACP runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-acp-runtime-${{ github.run_attempt }}
          path: notes.local/artifacts/acp-runtime-*/runtime.json
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: sccache --show-stats || true

  electron-e2e:
    name: nightly electron e2e
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CI_TIMING_JOB: nightly-electron-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: ./.github/actions/setup-rust-ci
      - name: Run curated Electron E2E
        run: vp exec tsx scripts/ci/run-timed.ts --name electron-e2e -- vp run test:e2e:nightly
      - name: Upload Electron E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-electron-e2e-failure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show Rust compiler cache statistics
        if: always()
        run: sccache --show-stats || true
      - name: Upload Electron E2E timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-nightly-electron-e2e-${{ github.run_attempt }}
          path: .generated/ci-timings/
          if-no-files-found: ignore
          retention-days: 14

  complete:
    name: nightly complete
    if: always()
    needs:
      - plan
      - static-contracts
      - rust-checks
      - app-tests
      - app-nightly
      - app-tests-macos
      - stress
      - runtime-contracts
      - electron-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every nightly gate
        env:
          CI_CLASSIFIER_RESULT: ${{ needs.plan.result }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --no-warnings scripts/ci/verify-required-gates.ts
