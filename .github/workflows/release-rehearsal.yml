name: Distribution Rehearsal

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full protected-main commit SHA to rehearse
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: distribution-rehearsal-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate rehearsal source
    runs-on: ubuntu-latest
    environment: release-source
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: main }
      - uses: ./.github/actions/verify-protected-main-source
        with:
          source_sha: ${{ inputs.source_sha }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          vp run release:resolve:source -- --channel stable --head "${{ inputs.source_sha }}" --output "${RUNNER_TEMP}/release-identity.json"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const value = require(process.argv[1]);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${value.sourceSha}\ntag=${value.tag}\nversion=${value.version}\n`);
          ' "${RUNNER_TEMP}/release-identity.json"

      - name: Upload Release Identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodex-release-identity-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-identity.json
          if-no-files-found: error
          retention-days: 14

  certification:
    name: certify exact rehearsal source
    needs: validate
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_certify-release-source.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}

  distribution:
    name: rehearse native distributions
    needs: [validate, certification]
    permissions:
      contents: read
    uses: ./.github/workflows/_macos-distribution.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}
      source_tree: ${{ needs.certification.outputs.source_tree }}
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      retention_days: 14
      upload_sentry_sourcemaps: false
    secrets:
      apple_api_issuer: ${{ secrets.APPLE_API_ISSUER }}
      apple_api_key_b64: ${{ secrets.APPLE_API_KEY_B64 }}
      apple_api_key_id: ${{ secrets.APPLE_API_KEY_ID }}
      csc_key_password: ${{ secrets.CSC_KEY_PASSWORD }}
      csc_link: ${{ secrets.CSC_LINK }}

  finalize-sparkle:
    name: finalize arm64 Sparkle updates
    needs: [validate, distribution]
    runs-on: macos-26
    environment: sparkle-feed-finalization
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: ./.github/actions/finalize-sparkle
        with:
          architecture: arm64
          channel: stable
          private_key: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          retention_days: 14
          source_sha: ${{ needs.validate.outputs.source_sha }}
          version: ${{ needs.validate.outputs.version }}

  assemble:
    name: assemble rehearsed Release Bundle
    needs: [validate, distribution, finalize-sparkle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_assemble-release.yml
    with:
      retention_days: 14
      source_sha: ${{ needs.validate.outputs.source_sha }}
      version: ${{ needs.validate.outputs.version }}
