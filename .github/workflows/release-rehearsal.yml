name: Distribution Rehearsal

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full protected-main commit SHA to rehearse
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: distribution-rehearsal-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate rehearsal source
    runs-on: ubuntu-latest
    environment: release-source
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: main }
      - uses: ./.github/actions/verify-protected-main-source
        with:
          source_sha: ${{ inputs.source_sha }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Resolve Build Identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          vp run release:resolve:source -- --head "${{ inputs.source_sha }}" --output "${RUNNER_TEMP}/build-identity.json"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const value = require(process.argv[1]);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${value.sourceSha}\nversion=${value.version}\n`);
          ' "${RUNNER_TEMP}/build-identity.json"

      - name: Upload Build Identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-build-identity-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/build-identity.json
          if-no-files-found: error
          retention-days: 14

  certification:
    name: certify exact rehearsal source
    needs: validate
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_certify-release-source.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}

  distribution:
    name: rehearse native distributions
    needs: [validate, certification]
    permissions:
      contents: read
    uses: ./.github/workflows/_macos-distribution.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}
      source_tree: ${{ needs.certification.outputs.source_tree }}
      retention_days: 14
      upload_sentry_sourcemaps: false
    secrets:
      apple_api_issuer: ${{ secrets.APPLE_API_ISSUER }}
      apple_api_key_b64: ${{ secrets.APPLE_API_KEY_B64 }}
      apple_api_key_id: ${{ secrets.APPLE_API_KEY_ID }}
      csc_key_password: ${{ secrets.CSC_KEY_PASSWORD }}
      csc_link: ${{ secrets.CSC_LINK }}

  windows-distribution:
    name: build native Windows distributions
    needs: [validate, certification]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_windows-distribution.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}
      source_tree: ${{ needs.certification.outputs.source_tree }}
      retention_days: 14

  mobile-distribution:
    name: build Nodex Mobile
    needs: [validate, certification]
    permissions:
      contents: read
    uses: ./.github/workflows/_mobile-distribution.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}
      source_tree: ${{ needs.certification.outputs.source_tree }}
      retention_days: 14
    secrets:
      android_release_keystore_b64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      android_release_keystore_password: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      apple_api_issuer: ${{ secrets.APPLE_API_ISSUER }}
      apple_api_key_b64: ${{ secrets.APPLE_API_KEY_B64 }}
      apple_api_key_id: ${{ secrets.APPLE_API_KEY_ID }}

  finalize-sparkle:
    name: finalize signed application updates
    needs: [validate, distribution, windows-distribution]
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, windows-x64, windows-arm64]
    runs-on: macos-26
    environment: sparkle-feed-finalization
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: ./.github/actions/finalize-sparkle
        with:
          architecture: ${{ matrix.architecture }}
          channel: stable
          rehearsal: "true"
          private_key: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          retention_days: 14
          source_sha: ${{ needs.validate.outputs.source_sha }}
          version: ${{ needs.validate.outputs.version }}

  assemble:
    name: assemble rehearsed Release Bundle
    needs: [validate, distribution, windows-distribution, mobile-distribution, finalize-sparkle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_assemble-release.yml
    with:
      channel: stable
      rehearsal: true
      retention_days: 14
      source_sha: ${{ needs.validate.outputs.source_sha }}
