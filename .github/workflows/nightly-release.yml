name: Nightly Release

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: release-nightly
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    name: resolve protected-main nightly candidate
    if: github.ref == 'refs/heads/main' && vars.NODEX_NIGHTLY_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.candidate.outputs.should_release }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile

      - name: Resolve deterministic candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The full checkout fetches main alongside the pinned workflow tools.
          main_head="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          result="${RUNNER_TEMP}/nightly-candidate.json"
          vp run release:resolve:nightly -- --repo "${GITHUB_REPOSITORY}" --head "${main_head}" --output "${result}"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const { decision, headSha, verified, newerFailure, identity } = require(process.argv[1]);
            const summary = [`Nightly decision: \`${decision}\`.`];
            if (verified) {
              const { sourceSha, runUrl, commitsBehindHead } = verified;
              summary.push(`Verified source \`${sourceSha}\` ([Main CI](${runUrl})), ${commitsBehindHead} commit(s) behind main HEAD \`${headSha}\`.`);
            } else {
              summary.push(`No successful Main CI push run found for an ancestor of main HEAD \`${headSha}\`.`);
            }
            if (newerFailure) {
              summary.push(`[Main CI failed](${newerFailure.runUrl}) for \`${newerFailure.sourceSha}\`.`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n\n") + "\n");

            const outputs = [`should_release=${decision === "eligible"}`];
            if (decision === "eligible") {
              const { channel, tag, ...build } = identity;
              fs.writeFileSync(process.argv[2], `${JSON.stringify(build, null, 2)}\n`);
              outputs.push(`source_sha=${build.sourceSha}`, `tag=${tag}`, `version=${build.version}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, outputs.join("\n") + "\n");
          ' "${result}" "${RUNNER_TEMP}/build-identity.json"

      - name: Upload Build Identity
        if: steps.candidate.outputs.should_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-build-identity-${{ steps.candidate.outputs.source_sha }}
          path: ${{ runner.temp }}/build-identity.json
          if-no-files-found: error
          retention-days: 14

  certification:
    if: needs.resolve.outputs.should_release == 'true'
    needs: resolve
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_certify-release-source.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  distribution:
    if: needs.resolve.outputs.should_release == 'true'
    needs: [resolve, certification]
    uses: ./.github/workflows/_macos-distribution.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      source_tree: ${{ needs.certification.outputs.source_tree }}
      retention_days: 14
      upload_sentry_sourcemaps: true
    secrets:
      apple_api_issuer: ${{ secrets.APPLE_API_ISSUER }}
      apple_api_key_b64: ${{ secrets.APPLE_API_KEY_B64 }}
      apple_api_key_id: ${{ secrets.APPLE_API_KEY_ID }}
      csc_key_password: ${{ secrets.CSC_KEY_PASSWORD }}
      csc_link: ${{ secrets.CSC_LINK }}
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      sentry_org: ${{ secrets.SENTRY_ORG }}
      sentry_project: ${{ secrets.SENTRY_PROJECT }}

  windows-distribution:
    name: build Windows x64 installer
    if: needs.resolve.outputs.should_release == 'true'
    needs: [resolve, certification]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_windows-distribution.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      source_tree: ${{ needs.certification.outputs.source_tree }}
      retention_days: 14

  mobile-distribution:
    name: build Nodex Mobile
    if: needs.resolve.outputs.should_release == 'true'
    needs: [resolve, certification]
    permissions:
      contents: read
    uses: ./.github/workflows/_mobile-distribution.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      source_tree: ${{ needs.certification.outputs.source_tree }}
      retention_days: 14
    secrets:
      android_release_keystore_b64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      android_release_keystore_password: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      apple_api_issuer: ${{ secrets.APPLE_API_ISSUER }}
      apple_api_key_b64: ${{ secrets.APPLE_API_KEY_B64 }}
      apple_api_key_id: ${{ secrets.APPLE_API_KEY_ID }}

  finalize-sparkle:
    if: needs.resolve.outputs.should_release == 'true'
    needs: [resolve, distribution, windows-distribution]
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, windows-x64]
    runs-on: macos-26
    # Deltas are an optimisation. A finalizer that stalls must not hold a release for six hours.
    timeout-minutes: 120
    environment: sparkle-feed-finalization
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: ./.github/actions/finalize-sparkle
        with:
          architecture: ${{ matrix.architecture }}
          channel: nightly
          private_key: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          retention_days: 14
          source_sha: ${{ needs.resolve.outputs.source_sha }}
          version: ${{ needs.resolve.outputs.version }}

  assemble:
    if: needs.resolve.outputs.should_release == 'true'
    needs: [resolve, distribution, windows-distribution, mobile-distribution, finalize-sparkle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_assemble-release.yml
    with:
      channel: nightly
      retention_days: 14
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  tag:
    name: create release tag
    needs: [resolve, assemble]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "${{ github.workflow_sha }}" }
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: ./.github/actions/release-tag
        with:
          channel: nightly
          source_sha: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.NODEX_RELEASE_TAG_TOKEN }}

  promote:
    if: needs.resolve.outputs.should_release == 'true'
    needs: [resolve, tag]
    permissions:
      attestations: read
      contents: write
    uses: ./.github/workflows/_promote-nightly.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
    secrets:
      landing_github_token: ${{ secrets.NODEXAPP_GITHUB_IO_TOKEN }}
