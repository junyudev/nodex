name: Windows

on:
  push:
    branches:
      - "codex/windows-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - name: Ensure rustup
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --profile minimal --default-toolchain none
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Build workspace
        run: cargo build --workspace --all-features --all-targets
      - name: Test workspace
        run: cargo test --workspace --all-features --no-fail-fast -- --test-threads=2

  app:
    name: app ${{ matrix.suite }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, renderer]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Verify Windows host contracts
        if: matrix.suite == 'unit'
        run: >-
          node --import tsx --input-type=module -e '
          import { vitestCommand } from "./scripts/testing/runtime.ts";
          import { runCommand } from "./scripts/tooling/process.ts";
          const files = ["src/main/platform/host-capabilities.test.ts", "src/main/platform/electron/ElectronClipboard.test.ts", "src/main/platform/electron/ElectronClipboardFallback.test.ts", "src/main/platform/node/CodexAccountHome.test.ts", "src/main/platform/node/NodexCliShell.windows.test.ts", "src/main/platform/node/OpenCodeInstallPlatform.windows.test.ts", "src/main/platform/node/TerminalEnvironment.test.ts", "src/main/platform/node/TerminalPty.windows.test.ts", "src/main/platform/node/TerminalPty.test.ts", "src/main/host-runtime/ApplicationHostRuntime.test.ts", "src/main/nodex-home.test.ts", "src/main/process-tree.test.ts"];
          process.exitCode = (await runCommand(vitestCommand("main", files, false, {cwd: process.cwd(), env: process.env, signal: new AbortController().signal}))).exitCode;'
      - name: Run application suite
        run: vp run test:${{ matrix.suite }}
