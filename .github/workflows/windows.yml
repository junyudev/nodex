name: Windows native release probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-release:
    name: native release ${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      CI_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Observe the native process release boundary
        timeout-minutes: 10
        run: vp exec node scripts/testing/windows-process-release-probe.mjs .generated/native-release-probe ${{ matrix.arch }}
      - name: Upload native process observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-probe-${{ matrix.arch }}-${{ github.sha }}
          path: .generated/native-release-probe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
