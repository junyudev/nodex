name: Windows deadline diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-deadline-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deadline:
    name: SQLite deadline ${{ matrix.suite }} x64
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [rust, core-client]
    env:
      CI_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Parse diagnostic scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .generated/deadline-probe -Force | Out-Null
          $results = @()
          foreach ($file in @('scripts/ci/windows-deadline-probe.ps1', 'scripts/ci/windows-deadline-resource-sampler.ps1')) {
            $parseTokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$parseTokens, [ref]$parseErrors)
            $results += @{ file = $file; errors = @($parseErrors | ForEach-Object { @{ id = $_.ErrorId; line = $_.Extent.StartLineNumber; column = $_.Extent.StartColumnNumber } }) }
          }
          $results | ConvertTo-Json -Depth 5 | Set-Content .generated/deadline-probe/powershell-parse.json
          if (@($results | Where-Object { $_.errors.Count -ne 0 }).Count -ne 0) { throw 'Diagnostic script parse failed.' }
      - uses: ./.github/actions/setup-vite-plus
      - uses: ./.github/actions/setup-windows-rust
      - name: Test native platform boundary
        if: matrix.suite == 'rust'
        run: cargo test --locked -p nodex-platform --all-features
      - name: Install native search test dependency
        if: matrix.suite == 'rust'
        run: cargo install --locked ripgrep
      - name: Build workspace
        if: matrix.suite == 'rust'
        run: cargo build --locked --workspace --all-features --all-targets
      - name: Install the frozen Core dependencies
        if: matrix.suite == 'core-client'
        run: vp install --frozen-lockfile
      - name: Validate the diagnostic interfaces
        if: matrix.suite == 'core-client'
        shell: pwsh
        run: |
          & vp run typecheck 2>&1 | Tee-Object -FilePath .generated/deadline-probe/semantic.log
          exit $LASTEXITCODE
      - name: Observe the complete Rust workspace
        if: matrix.suite == 'rust'
        shell: pwsh
        run: ./scripts/ci/windows-deadline-probe.ps1 -Suite rust -OutputDirectory .generated/deadline-probe
      - name: Observe the complete Core suite
        if: matrix.suite == 'core-client'
        shell: pwsh
        env:
          NODEX_LOG_FILE: 'true'
          NODEX_LOG_FILE_LEVEL: warn
          NODEX_LOG_MAX_FILE_BYTES: '1048576'
          NODEX_LOG_MAX_TOTAL_BYTES: '4194304'
        run: ./scripts/ci/windows-deadline-probe.ps1 -Suite core-client -OutputDirectory .generated/deadline-probe
      - name: Upload bounded deadline observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-deadline-${{ matrix.suite }}-x64-${{ github.sha }}
          path: .generated/deadline-probe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
