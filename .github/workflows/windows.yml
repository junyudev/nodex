name: Windows

on:
  push:
    branches:
      - "codex/windows-**"
  pull_request:
    paths:
      - ".gitattributes"
      - ".node-version"
      - ".cargo/**"
      - "agent-skills/**"
      - "crates/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "src/**"
      - "packages/**"
      - "scripts/**"
      - "resources/**"
      - "config/**"
      - "*config*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "electron-builder.yml"
      - ".github/workflows/windows.yml"
      - ".github/workflows/_windows-distribution.yml"
      - ".github/actions/**"
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: "Reprobe this run's installers without rebuilding (diagnostics only)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: inputs.installer_run_id == ''
    name: rust ${{ matrix.arch }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - uses: ./.github/actions/setup-windows-rust
      - name: Test native platform boundary
        run: cargo test --locked -p nodex-platform --all-features
      - name: Install native search test dependency
        run: cargo install --locked ripgrep
      - name: Build workspace
        run: cargo build --locked --workspace --all-features --all-targets
      - name: Test workspace
        # Large storage fixtures otherwise compete with unrelated request-deadline tests.
        # Run every test, but give the two 100,000-row work-bound fixtures their own phase.
        run: >-
          cargo test --locked --workspace --all-features --no-fail-fast -- --test-threads=2
          --skip database::tests::large_source_commit_projection_has_bounded_writer_work
          --skip database::tests::manual_position_commands_keep_writer_work_bounded_as_source_grows
      - name: Test bounded projection writer work
        run: cargo test --locked -p nodex-core --all-features --lib database::tests::large_source_commit_projection_has_bounded_writer_work -- --exact --nocapture --test-threads=1
      - name: Test bounded manual-position writer work
        run: cargo test --locked -p nodex-core --all-features --lib database::tests::manual_position_commands_keep_writer_work_bounded_as_source_grows -- --exact --nocapture --test-threads=1

  app:
    if: inputs.installer_run_id == ''
    name: app ${{ matrix.suite }} ${{ matrix.arch }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, core-client, main, renderer, integration]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      CI_SOURCE_SHA: ${{ github.sha }}
      CI_TIMING_JOB: windows-app-${{ matrix.suite }}-${{ matrix.arch }}
      NODEX_TEST_TIMINGS: .generated/ci-timings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Resolve suite prerequisites
        id: suite
        run: vp exec tsx scripts/ci/app-test-suite.ts --suite ${{ matrix.suite }}
      - uses: ./.github/actions/setup-windows-rust
        if: steps.suite.outputs.needs_rust == 'true'
      - name: Run application suite
        if: matrix.suite != 'core-client'
        run: >-
          vp exec tsx scripts/ci/run-timed.ts
          --name app-${{ matrix.suite }}
          -- vp run test:${{ matrix.suite }}
      - name: Run ordinary Core-client suite
        if: matrix.suite == 'core-client'
        run: >-
          vp exec tsx scripts/ci/run-timed.ts
          --name app-core-client
          -- vp run test:core-client --exclude src/main/core-client/canvas-recovery-bytes.node.test.ts
      - name: Test large Canvas binary recovery
        if: matrix.suite == 'core-client'
        run: >-
          vp exec tsx scripts/ci/run-timed.ts
          --name app-core-client-canvas-recovery
          -- vp run test:core-client src/main/core-client/canvas-recovery-bytes.node.test.ts --maxWorkers=1
      - name: Test Windows Codex sandbox lifecycle
        if: matrix.suite == 'unit'
        run: >-
          vp test run --config packages/agent-runtime/vite.config.ts
          packages/agent-runtime/src/provider/CodexWindowsSandbox.test.ts
          packages/agent-runtime/src/orchestration-v2/Adapters/CodexAdapterV2.test.ts
          -t "Windows|Windows sandbox"
      - name: Upload application diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app-${{ matrix.suite }}-${{ matrix.arch }}-failure-${{ github.run_attempt }}
          path: |
            .vitest-attachments/
            test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload application timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-windows-app-${{ matrix.suite }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: .generated/ci-timings/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: native Windows distribution
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_windows-distribution.yml
    with:
      source_sha: ${{ github.sha }}
      release: false
      installer_run_id: ${{ inputs.installer_run_id || '' }}
      retention_days: 14
