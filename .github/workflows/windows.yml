name: Windows

on:
  push:
    branches:
      - "codex/windows-**"
  pull_request:
    paths:
      - ".gitattributes"
      - ".node-version"
      - ".cargo/**"
      - "agent-skills/**"
      - "crates/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "src/**"
      - "packages/**"
      - "scripts/**"
      - "resources/**"
      - "config/**"
      - "*config*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "electron-builder.yml"
      - ".github/workflows/windows.yml"
      - ".github/actions/**"
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: "Reprobe this run's installers without rebuilding (diagnostics only)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: inputs.installer_run_id == ''
    name: rust ${{ matrix.arch }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - uses: ./.github/actions/setup-windows-rust
      - name: Test native platform boundary
        run: cargo test --locked -p nodex-platform --all-features
      - name: Install native search test dependency
        run: cargo install --locked ripgrep
      - name: Build workspace
        run: cargo build --locked --workspace --all-features --all-targets
      - name: Test workspace
        run: cargo test --locked --workspace --all-features --no-fail-fast -- --test-threads=2

  app:
    if: inputs.installer_run_id == ''
    name: app ${{ matrix.suite }} ${{ matrix.arch }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, core-client, main, renderer, integration]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Resolve suite prerequisites
        id: suite
        run: vp exec tsx scripts/ci/app-test-suite.ts --suite ${{ matrix.suite }}
      - uses: ./.github/actions/setup-windows-rust
        if: steps.suite.outputs.needs_rust == 'true'
      - name: Run application suite
        run: vp run test:${{ matrix.suite }}

  package:
    name: installer ${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - uses: ./.github/actions/setup-windows-rust
        if: inputs.installer_run_id == ''
      - run: vp install --frozen-lockfile
      - name: Require native Node
        run: node -e "if (process.platform !== 'win32' || process.arch !== '${{ matrix.arch }}') throw new Error('Packaging requires native Windows Node')"
      - name: Build Windows application
        if: inputs.installer_run_id == ''
        run: vp run build
      - name: Stage Windows native runtime
        if: inputs.installer_run_id == ''
        run: vp run stage:native-runtime:win:${{ matrix.arch }}
      - name: Verify staged CPU and clean-machine dependencies
        if: inputs.installer_run_id == ''
        run: |
          vp run verify:runtime:win .generated/codex-runtime ${{ matrix.arch }}
          vp run verify:runtime:win .generated/node-runtime/win32-${{ matrix.arch }} ${{ matrix.arch }}
      - name: Package prepared NSIS installer
        if: inputs.installer_run_id == ''
        run: vp run package:win:prepared ${{ matrix.arch }}
      - name: Upload installer
        if: inputs.installer_run_id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-windows-${{ matrix.arch }}-${{ github.sha }}
          path: dist/Nodex-*-win-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Download existing installer for diagnosis
        if: inputs.installer_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.installer_run_id }}
          pattern: nodex-windows-${{ matrix.arch }}-*
          path: dist
          merge-multiple: true
      - name: Install, probe Core and Agent startup, and uninstall
        run: vp exec tsx scripts/ci/probe-windows-installer.ts --arch ${{ matrix.arch }} --artifacts .generated/windows-probe
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-windows-probe-${{ matrix.arch }}-${{ github.sha }}
          path: .generated/windows-probe/artifacts/
          if-no-files-found: ignore
          retention-days: 14
