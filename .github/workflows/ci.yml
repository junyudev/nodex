name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every conditional gate
        default: true
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      changed_paths: ${{ steps.outputs.outputs.changed_paths }}
      plan: ${{ steps.outputs.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 "${HEAD_SHA}")"
          fi
          arguments=(--base "${base_sha}" --head "${HEAD_SHA}" --output "${RUNNER_TEMP}/classification.json")
          if [[ "${FORCE_FULL}" == "true" ]]; then
            arguments+=(--full)
          fi
          node --no-warnings scripts/ci/classify-change.ts "${arguments[@]}"
      - name: Publish typed gate plan
        id: outputs
        run: node --no-warnings scripts/ci/write-github-outputs.ts --input "${RUNNER_TEMP}/classification.json"

  release-transition:
    name: release transition
    if: ${{ fromJSON(needs.classify.outputs.plan).releaseTransition }}
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile --ignore-scripts
      - name: Verify exact stable release transition
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          transition="${RUNNER_TEMP}/release-transition.json"
          identity="${RUNNER_TEMP}/release-identity.json"
          vp run release:detect -- \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --output "${transition}"
          test "$(node -p "require('${transition}').shouldRelease")" = true
          vp run release:resolve:stable -- \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --output "${identity}"
          version="$(node -p "require('${identity}').version")"
          vp run release:check:remote -- \
            --repo "${GITHUB_REPOSITORY}" \
            --source-sha "${HEAD_SHA}" \
            --version "${version}"
          {
            echo "## Release transition"
            echo
            echo '```json'
            cat "${transition}"
            echo '```'
            echo
            echo '```json'
            cat "${identity}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  static-contracts:
    name: static contracts
    if: ${{ toJSON(fromJSON(needs.classify.outputs.plan).staticGroups) != '[]' }}
    needs: classify
    uses: ./.github/workflows/_static-checks.yml
    with:
      groups_json: ${{ toJSON(fromJSON(needs.classify.outputs.plan).staticGroups) }}
      timing_prefix: pr-static

  rust-checks:
    name: rust checks
    if: ${{ fromJSON(needs.classify.outputs.plan).rustFast || fromJSON(needs.classify.outputs.plan).protocolContracts || fromJSON(needs.classify.outputs.plan).rustMigration }}
    needs: classify
    uses: ./.github/workflows/_rust-checks.yml
    with:
      changed_paths_json: ${{ needs.classify.outputs.changed_paths }}
      full_workspace: ${{ fromJSON(needs.classify.outputs.plan).rustFull }}
      run_fast: ${{ fromJSON(needs.classify.outputs.plan).rustFast }}
      run_migration: ${{ fromJSON(needs.classify.outputs.plan).rustMigration }}
      run_protocol: ${{ fromJSON(needs.classify.outputs.plan).protocolContracts }}
      timing_prefix: pr-rust

  app-tests:
    name: app tests
    if: ${{ toJSON(fromJSON(needs.classify.outputs.plan).appTestSuites) != '[]' }}
    needs: classify
    uses: ./.github/workflows/_app-tests.yml
    with:
      gate_plan_json: ${{ needs.classify.outputs.plan }}
      suites_json: ${{ toJSON(fromJSON(needs.classify.outputs.plan).appTestSuites) }}
      timing_prefix: pr-app

  required:
    name: required
    if: always()
    needs:
      - classify
      - release-transition
      - static-contracts
      - rust-checks
      - app-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vite-plus
      - name: Require every selected gate
        env:
          CI_GATE_PLAN_JSON: ${{ needs.classify.outputs.plan }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --no-warnings scripts/ci/verify-required-gates.ts
