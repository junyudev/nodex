name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      full:
        description: Run every conditional gate
        default: true
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  # Queued groups have separate runs, even when GitHub rebuilds the same queue ref.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      changed_paths: ${{ steps.outputs.outputs.changed_paths }}
      plan: ${{ steps.outputs.outputs.plan }}
      app_lanes: ${{ steps.outputs.outputs.app_lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          DRAFT_PLAN: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}
          HEAD_SHA: ${{ github.event_name != 'merge_group' && github.sha || github.event.merge_group.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
              echo "::error::The event did not provide a comparison base."
              exit 1
            fi
            base_sha="$(git rev-list --max-parents=0 "${HEAD_SHA}")"
          fi
          arguments=(--base "${base_sha}" --head "${HEAD_SHA}" --output "${RUNNER_TEMP}/classification.json")
          if [[ "${FORCE_FULL}" == "true" ]]; then
            arguments+=(--full)
          fi
          if [[ "${DRAFT_PLAN}" == "true" ]]; then
            arguments+=(--draft)
          fi
          node --no-warnings scripts/ci/classify-change.ts "${arguments[@]}"
      - name: Publish typed gate plan
        id: outputs
        run: node --no-warnings scripts/ci/write-github-outputs.ts --input "${RUNNER_TEMP}/classification.json"

  static-contracts:
    name: static contracts
    if: ${{ toJSON(fromJSON(needs.classify.outputs.plan).staticGroups) != '[]' }}
    needs: classify
    uses: ./.github/workflows/_static-checks.yml
    with:
      groups_json: ${{ toJSON(fromJSON(needs.classify.outputs.plan).staticGroups) }}
      timing_prefix: pr-static

  rust-checks:
    name: rust checks
    if: ${{ fromJSON(needs.classify.outputs.plan).rustFast || fromJSON(needs.classify.outputs.plan).protocolContracts }}
    needs: classify
    uses: ./.github/workflows/_rust-checks.yml
    with:
      changed_paths_json: ${{ needs.classify.outputs.changed_paths }}
      full_workspace: ${{ fromJSON(needs.classify.outputs.plan).rustFull }}
      run_fast: ${{ fromJSON(needs.classify.outputs.plan).rustFast }}
      run_protocol: ${{ fromJSON(needs.classify.outputs.plan).protocolContracts }}
      timing_prefix: pr-rust

  app-tests:
    name: app tests
    if: ${{ toJSON(fromJSON(needs.classify.outputs.plan).appTestSuites) != '[]' }}
    needs: classify
    uses: ./.github/workflows/_app-tests.yml
    with:
      gate_plan_json: ${{ needs.classify.outputs.plan }}
      lanes_json: ${{ needs.classify.outputs.app_lanes }}
      timing_prefix: pr-app

  windows-checks:
    name: windows checks
    if: ${{ fromJSON(needs.classify.outputs.plan).windowsChecks }}
    needs: classify
    uses: ./.github/workflows/_windows-checks.yml

  required:
    name: required
    if: always()
    needs:
      - classify
      - static-contracts
      - rust-checks
      - app-tests
      - windows-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected gate
        id: verify
        env:
          CI_GATE_PLAN_JSON: ${{ needs.classify.outputs.plan }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --no-warnings scripts/ci/verify-required-gates.ts
