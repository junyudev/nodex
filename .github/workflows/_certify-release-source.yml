name: Certify Release Source

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character source commit to certify.
        required: true
        type: string
    outputs:
      source_tree:
        description: Certified Git tree for the exact source commit.
        value: ${{ jobs.certify.outputs.source_tree }}

permissions:
  actions: read
  contents: read

jobs:
  guard:
    name: verify protected-main source
    runs-on: ubuntu-latest
    environment: release-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: main }
      - uses: ./.github/actions/verify-protected-main-source
        with:
          source_sha: ${{ inputs.source_sha }}

  static-contracts:
    name: certify static contracts
    needs: guard
    uses: ./.github/workflows/_static-checks.yml
    with:
      groups_json: '["types","source-ownership","ui-contracts","ci-contracts","repository-contracts","dependency-security","generated","landing"]'
      source_sha: ${{ inputs.source_sha }}
      timing_prefix: certify-static

  rust-checks:
    name: certify rust checks
    needs: guard
    uses: ./.github/workflows/_rust-checks.yml
    with:
      full_workspace: true
      run_fast: true
      run_migration: true
      run_protocol: true
      source_sha: ${{ inputs.source_sha }}
      timing_prefix: certify-rust

  app-tests:
    name: certify application and browser tests
    needs: guard
    uses: ./.github/workflows/_app-tests.yml
    with:
      gate_plan_json: '{"allGates":true,"appTestSuites":["unit","effect-codex","agent-runtime","core-client","main","renderer","integration","browser"],"dependencyKind":"source","docsOnly":false,"landingOnly":false,"protocolContracts":true,"relatedPaths":[],"releaseTransition":false,"rustFast":true,"rustFull":true,"rustMigration":true,"staticGroups":["types","source-ownership","ui-contracts","ci-contracts","repository-contracts","dependency-security","generated","landing"],"testMode":"full"}'
      source_sha: ${{ inputs.source_sha }}
      suites_json: '["unit","effect-codex","agent-runtime","core-client","main","renderer","integration","browser"]'
      timing_prefix: certify-app

  stress:
    name: certify stress contracts
    needs: guard
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/run-stress-tests

  runtime-contracts:
    name: certify macOS runtime contracts
    needs: guard
    runs-on: macos-26
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - uses: ./.github/actions/setup-rust-ci
      - run: vp run verify:runtime:mac
      - if: always()
        run: sccache --show-stats || true

  certify:
    name: issue exact-source certificate
    needs:
      - static-contracts
      - rust-checks
      - app-tests
      - stress
      - runtime-contracts
    runs-on: ubuntu-latest
    outputs:
      source_tree: ${{ steps.identity.outputs.source_tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Materialize exact-source certificate
        id: identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "source_tree=${source_tree}" >> "${GITHUB_OUTPUT}"
          # Certificate emission needs no project runtime, dependency code or cache.
          SOURCE_TREE="${source_tree}" python3 - "${RUNNER_TEMP}/source-certification.json" <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import sys

          certificate = {
              "schemaVersion": 1,
              "sourceSha": os.environ["SOURCE_SHA"],
              "sourceTree": os.environ["SOURCE_TREE"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "issuedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(certificate, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-source-certification-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/source-certification.json
          if-no-files-found: error
          retention-days: 30
