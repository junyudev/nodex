name: Reusable Application Tests

on:
  workflow_call:
    inputs:
      suites_json:
        description: JSON array of canonical application test suites.
        required: true
        type: string
      gate_plan_json:
        description: Validated CI gate plan containing full or related test selection.
        required: true
        type: string
      source_sha:
        description: Exact source commit to test; defaults to the caller commit.
        required: false
        type: string
      timing_prefix:
        description: Stable prefix for timing artifacts and summaries.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: app ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites_json) }}
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      CI_TIMING_JOB: ${{ inputs.timing_prefix }}-${{ matrix.suite }}
      NODEX_TEST_TIMINGS: .generated/ci-timings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Resolve suite prerequisites
        id: suite
        env:
          APP_TEST_SUITE: ${{ matrix.suite }}
        run: vp exec tsx scripts/ci/app-test-suite.ts --suite "${APP_TEST_SUITE}"
      - uses: ./.github/actions/setup-rust-ci
        if: steps.suite.outputs.needs_rust == 'true'
      - uses: ./.github/actions/setup-playwright
        if: steps.suite.outputs.needs_playwright == 'true'
      - name: Run application suite
        env:
          CI_GATE_PLAN_JSON: ${{ inputs.gate_plan_json }}
          APP_TEST_SUITE: ${{ matrix.suite }}
          DEBUG: ${{ matrix.suite == 'browser' && 'pw:browser,vitest:browser*,vite:deps,vite:hmr' || '' }}
          NEEDS_RUST: ${{ steps.suite.outputs.needs_rust }}
          NEEDS_XVFB: ${{ steps.suite.outputs.needs_xvfb }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${NEEDS_RUST}" == "true" ]]; then
            export RUSTC_WRAPPER=sccache
            export SCCACHE_GHA_ENABLED=true
          fi
          if [[ "${NEEDS_XVFB}" == "true" ]]; then
            vp exec tsx scripts/ci/run-timed.ts \
              --name "app-${APP_TEST_SUITE}" \
              -- xvfb-run --auto-servernum vp exec tsx scripts/ci/run-app-test-suite.ts \
                --suite "${APP_TEST_SUITE}"
            exit 0
          fi
          vp exec tsx scripts/ci/run-timed.ts \
            --name "app-${APP_TEST_SUITE}" \
            -- vp exec tsx scripts/ci/run-app-test-suite.ts --suite "${APP_TEST_SUITE}"
      - name: Show renderer memory state
        if: always() && matrix.suite == 'renderer'
        run: free -h
      - name: Show failed browser runner resources
        if: failure() && matrix.suite == 'browser'
        run: |
          free -h
          df -h "${GITHUB_WORKSPACE}" /tmp /dev/shm
          df -i "${GITHUB_WORKSPACE}" /tmp /dev/shm
          ps -eo pid,ppid,stat,rss,comm --sort=-rss
          for browser_cgroup_counter in memory.events memory.peak memory.max; do
            browser_cgroup_file="/sys/fs/cgroup/${browser_cgroup_counter}"
            if [[ ! -r "${browser_cgroup_file}" ]]; then continue; fi
            printf '%s:\n' "${browser_cgroup_counter}"
            cat "${browser_cgroup_file}"
          done
      - name: Upload application diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.suite }}-failure-${{ github.run_attempt }}
          path: |
            .vitest-attachments/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show Rust compiler cache statistics
        if: always() && steps.suite.outputs.needs_rust == 'true'
        run: sccache --show-stats || true
      - name: Upload application timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-${{ inputs.timing_prefix }}-${{ matrix.suite }}-${{ github.run_attempt }}
          path: .generated/ci-timings/
          if-no-files-found: ignore
          retention-days: 14
