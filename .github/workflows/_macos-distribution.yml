name: macOS Distribution

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact protected-main commit to build
        required: true
        type: string
      source_tree:
        description: Exact certified Git tree to build.
        required: true
        type: string
      version:
        description: Stable application version
        required: true
        type: string
      tag:
        description: Stable application tag
        required: true
        type: string
      retention_days:
        description: Artifact retention period
        default: 14
        required: false
        type: number
      upload_sentry_sourcemaps:
        description: Upload source maps once from the arm64 production build
        default: false
        required: false
        type: boolean
    secrets:
      apple_api_issuer:
        required: true
      apple_api_key_b64:
        required: true
      apple_api_key_id:
        required: true
      csc_key_password:
        required: true
      csc_link:
        required: true
      sentry_auth_token:
        required: false
      sentry_org:
        required: false
      sentry_project:
        required: false

permissions:
  contents: read

jobs:
  arm64:
    name: arm64 distribution
    runs-on: macos-26
    environment: macos-distribution
    env:
      RELEASE_ARCH: arm64
      RELEASE_OUTPUT: ${{ github.workspace }}/.generated/release-architecture/arm64
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_SOURCE_TREE: ${{ inputs.source_tree }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/setup-vite-plus
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nodex-release-identity-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/identity
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nodex-source-certification-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/certification

      - name: Verify exact clean release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SOURCE_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${RELEASE_SOURCE_TREE}"
          test -z "$(git status --porcelain)"
          vp install --frozen-lockfile
          node -e '
            const certificate = require(process.argv[1]);
            if (certificate.schemaVersion !== 1
              || certificate.sourceSha !== process.env.RELEASE_SOURCE_SHA
              || certificate.sourceTree !== process.env.RELEASE_SOURCE_TREE) {
              throw new Error("Release source certification does not match the exact source tree");
            }
          ' "${RUNNER_TEMP}/certification/source-certification.json"
          vp run release:verify:identity -- --identity "${RUNNER_TEMP}/identity/release-identity.json" --head "${RELEASE_SOURCE_SHA}" --output "${RUNNER_TEMP}/source.json"
          node -e '
            const source = require(process.argv[1]);
            if (source.version !== process.env.RELEASE_VERSION || source.tag !== process.env.RELEASE_TAG) {
              throw new Error("Release source identity does not match workflow inputs");
            }
          ' "${RUNNER_TEMP}/source.json"

      - name: Materialize macOS signing credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.apple_api_issuer }}
          APPLE_API_KEY_B64: ${{ secrets.apple_api_key_b64 }}
          APPLE_API_KEY_ID: ${{ secrets.apple_api_key_id }}
          CSC_KEY_PASSWORD: ${{ secrets.csc_key_password }}
          CSC_LINK: ${{ secrets.csc_link }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY_B64}" || -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_ISSUER}" || -z "${CSC_LINK}" || -z "${CSC_KEY_PASSWORD}" ]]; then
            echo "Missing macOS signing or App Store Connect credentials." >&2
            exit 1
          fi
          vp exec tsx scripts/ci/macos-signing-keychain.ts prepare

      - name: Build and verify signed distribution
        env:
          APPLE_API_ISSUER: ${{ secrets.apple_api_issuer }}
          APPLE_API_KEY_ID: ${{ secrets.apple_api_key_id }}
          NODE_OPTIONS: --max-old-space-size=6144
          SENTRY_AUTH_TOKEN: ${{ inputs.upload_sentry_sourcemaps && secrets.sentry_auth_token || '' }}
          SENTRY_ORG: ${{ inputs.upload_sentry_sourcemaps && secrets.sentry_org || '' }}
          SENTRY_PROJECT: ${{ inputs.upload_sentry_sourcemaps && secrets.sentry_project || '' }}
          SENTRY_RELEASE: nodex@${{ inputs.version }}
          UPLOAD_SENTRY_SOURCEMAPS: ${{ inputs.upload_sentry_sourcemaps }}
        run: |
          if [[ "${UPLOAD_SENTRY_SOURCEMAPS}" == "true" && ( -z "${SENTRY_AUTH_TOKEN}" || -z "${SENTRY_ORG}" || -z "${SENTRY_PROJECT}" ) ]]; then
            echo "Production distribution requires complete Sentry source-map credentials." >&2
            exit 1
          fi
          vp run release:build:mac -- \
            --arch "${RELEASE_ARCH}" \
            --identity "${RUNNER_TEMP}/identity/release-identity.json" \
            --output "${RELEASE_OUTPUT}"
          cp "${RUNNER_TEMP}/certification/source-certification.json" \
            "${RELEASE_OUTPUT}/source-certification.json"

      - name: Summarize architecture identity
        if: success()
        shell: bash
        run: |
          {
            echo "## arm64 distribution"
            echo
            echo '```json'
            cat "${RELEASE_OUTPUT}/architecture-build.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove macOS signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${NODEX_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${NODEX_SIGNING_KEYCHAIN}" >/dev/null 2>&1 || true
            rm -f "${NODEX_SIGNING_KEYCHAIN}"
          fi
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            rm -f "${APPLE_API_KEY}"
          fi
          if [[ -n "${NODEX_SIGNING_CERTIFICATE:-}" ]]; then
            rm -f "${NODEX_SIGNING_CERTIFICATE}"
          fi

      - name: Upload JavaScript source maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-javascript-sourcemaps-arm64-${{ inputs.source_sha }}
          path: |
            out/**/*.map
            .generated/prepared-electron-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload arm64 architecture bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-macos-arm64-${{ inputs.source_sha }}
          path: ${{ env.RELEASE_OUTPUT }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
