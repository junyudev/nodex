name: Deploy Landing Site

on:
  push:
    branches:
      - main
    paths:
      - "packages/landing/**"
      - "src/renderer/assets/subagent-avatars/**"
      - "src/shared/release-download.ts"
      - ".github/workflows/deploy-landing-site.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "CHANGELOG.md"
      - "changes/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: deploy landing site
    runs-on: ubuntu-latest
    environment: landing-production
    # On the main-only job, so a skipped dispatch from another ref never cancels a deploy.
    concurrency:
      group: landing-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Fetch stable release tags
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags --refs origin 'v*' |
            awk '$2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+$/ {print $2 ":" $2}' > "${RUNNER_TEMP}/landing-stable-tags"
          if [[ -s "${RUNNER_TEMP}/landing-stable-tags" ]]; then
            git fetch --depth=1 --no-tags --stdin origin < "${RUNNER_TEMP}/landing-stable-tags"
          fi
      - run: vp run build:landing
        env:
          NODEX_LANDING_DEPLOY: "1"
      - name: Deploy the landing Worker
        run: vp run --filter @nodex/landing deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LANDING_DEPLOY_TOKEN }}
      - name: Verify the public changelog
        shell: bash
        run: |
          set -euo pipefail
          live_changelog="${RUNNER_TEMP}/landing-changelog.json"
          for attempt in {1..6}; do
            if curl --fail --silent --show-error --compressed --max-time 10 \
              --header 'Cache-Control: no-cache' --output "${live_changelog}" \
              "https://nodex.jyu.app/changelog.json" &&
              cmp --silent packages/landing/dist/changelog.json "${live_changelog}"; then
              exit 0
            fi
            if [[ "${attempt}" -lt 6 ]]; then sleep 5; fi
          done
          echo "The public changelog does not match the deployed build." >&2
          exit 1
