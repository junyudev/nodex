name: Reusable Static Checks

on:
  workflow_call:
    inputs:
      groups_json:
        description: JSON array of canonical static check groups.
        required: true
        type: string
      source_sha:
        description: Exact source commit to check; defaults to the caller commit.
        required: false
        type: string
      timing_prefix:
        description: Stable prefix for timing artifacts and summaries.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: static ${{ matrix.group }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.groups_json) }}
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      CI_TIMING_JOB: ${{ inputs.timing_prefix }}-${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-vite-plus
      - run: vp install --frozen-lockfile
      - name: Run static group
        env:
          STATIC_GROUP: ${{ matrix.group }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${STATIC_GROUP}" == "types" ]]; then
            vp exec tsx scripts/ci/run-timed.ts \
              --name "static-${STATIC_GROUP}" \
              -- vp run check
            exit 0
          fi
          vp exec tsx scripts/ci/run-timed.ts \
            --name "static-${STATIC_GROUP}" \
            -- vp exec tsx scripts/ci/verify-static.ts --group "${STATIC_GROUP}"
      - name: Upload static timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-${{ inputs.timing_prefix }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: .generated/ci-timings/
          if-no-files-found: ignore
          retention-days: 14
